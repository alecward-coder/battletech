<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a12; color: #ccc; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
    #container { display: flex; flex: 1; }
    #canvasWrap { flex: 1; position: relative; }
    #canvas { display: block; cursor: crosshair; }
    /* SYS-013 jump visual overlay (translation flash) */
    #jumpOverlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a30;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }
    #panel { width: 200px; background: #12121a; border-left: 1px solid #333; padding: 12px; overflow-y: auto; }
    #panel h2 { font-size: 11px; color: #666; margin-bottom: 8px; }
    #shipCurrent { color: #f0a; font-size: 14px; font-weight: bold; }
    #shipDrive { font-size: 11px; color: #888; margin-top: 4px; line-height: 1.6; }
    #systemName { color: #0fa; font-size: 16px; font-weight: bold; }
    #systemInfo { font-size: 12px; color: #888; margin-top: 6px; line-height: 1.6; }
    #systemActions { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    #systemActions button { font-size: 11px; padding: 4px 8px; }
    #systemActions button:disabled { opacity: 0.35; cursor: not-allowed; }
    #controls { margin-top: 20px; padding-top: 12px; border-top: 1px solid #333; font-size: 11px; color: #555; line-height: 1.8; }
    #header { background: #12121a; padding: 8px 12px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    #header h1 { font-size: 14px; color: #0fa; }
    #header span { font-size: 11px; color: #555; }
    #simClock { font-size: 12px; color: #8cf; letter-spacing: 0.05em; }
    #simClockLabel { font-size: 10px; color: #445; margin-right: 6px; }
    #systemCount { font-size: 10px; color: #556; margin-left: 12px; }
    button { background: #222; border: 1px solid #444; color: #aaa; padding: 4px 10px; cursor: pointer; font-family: monospace; transition: background 60ms linear, color 60ms linear, border-color 60ms linear; }
    button:hover { background: #333; }
    button:active:not(:disabled) { background: #0fa; color: #000; border-color: #0fa; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* SYS-013 wait bar */
    #waitBar { background: #0f0f17; padding: 6px 12px; border-bottom: 1px solid #2a2a36; display: flex; align-items: center; gap: 6px; font-family: monospace; }
    #waitBar button { font-size: 11px; padding: 3px 8px; }
    .waitBar-label { font-size: 11px; color: #555; margin-right: 4px; }
    .waitBar-next { color: #8cf !important; border-color: #8cf !important; }
    .waitBar-next:hover { background: #8cf !important; color: #000 !important; }
    .waitBar-status { font-size: 10px; color: #556; margin-left: 12px; flex: 1; }

    /* SYS-013 ship prep status */
    #shipPrep { font-size: 11px; color: #cf8; margin-top: 4px; line-height: 1.5; }

    /* SYS-013 crew announcements */
    #announcementLog { font-size: 10px; color: #888; line-height: 1.5; max-height: 160px; overflow-y: auto; padding-right: 4px; }
    #announcementLog .ann-row { padding: 2px 0; border-bottom: 1px solid #1f1f28; }
    #announcementLog .ann-row:last-child { border-bottom: none; }
    #announcementLog .ann-time { color: #445; margin-right: 4px; }
    #announcementLog .ann-text { color: #aaa; }
    #announcementLog .ann-emergency .ann-text { color: #f96; }
    #announcementLog .ann-empty { color: #333; font-style: italic; }

    /* SYS-013 jump action button styles */
    #systemActions .btn-prep { color: #0fa; border-color: #0fa; }
    #systemActions .btn-prep:hover:enabled { background: #0fa; color: #000; }
    #systemActions .btn-commit { color: #cf8; border-color: #cf8; }
    #systemActions .btn-commit:hover:enabled { background: #cf8; color: #000; }
    #systemActions .btn-emergency { color: #f96; border-color: #f96; }
    #systemActions .btn-emergency:hover:enabled { background: #f96; color: #000; }
    #systemActions .btn-abort { color: #f66; border-color: #f66; }
    #systemActions .btn-abort:hover:enabled { background: #f66; color: #000; }

    /* Music button */
    #musicBtn {
      position: fixed; bottom: 16px; right: 16px;
      background: rgba(10,10,18,0.85); color: #556;
      border: 1px solid #333; border-radius: 4px;
      padding: 5px 10px; cursor: pointer;
      font-family: monospace; font-size: 12px;
      z-index: 9999; transition: color 0.2s, border-color 0.2s;
    }
    #musicBtn:hover { color: #0fa; border-color: #0fa; }
    #musicBtn.playing { color: #8cf; border-color: #8cf; }

    /* Halden panel */
    #halden-panel {
      position: fixed; bottom: 52px; right: 16px;
      width: 340px;
      background: rgba(10,10,18,0.92);
      border: 1px solid rgba(0,255,255,0.15);
      border-radius: 4px;
      padding: 12px;
      font-family: monospace; font-size: 13px; color: #ccc;
      z-index: 9998;
    }
    #halden-label {
      color: #0ff; font-size: 11px; margin-bottom: 8px; opacity: 0.7;
    }
    #halden-response {
      min-height: 60px; max-height: 180px;
      overflow-y: auto;
      margin-bottom: 8px;
      color: #eee; line-height: 1.6; font-size: 12px;
    }
    #halden-input {
      width: 100%; background: #111;
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 2px;
      color: #fff; padding: 6px;
      font-family: monospace; font-size: 12px;
      box-sizing: border-box;
      outline: none;
    }
    #halden-input:focus { border-color: rgba(0,255,255,0.5); }
    #halden-input::placeholder { color: #444; }
  </style>
</head>
<body>
  <div id="header">
    <h1 id="viewTitle">Phase 0 Starmap</h1>
    <div>
      <span id="simClockLabel">TC/TST</span>
      <span id="simClock">--</span>
      <span id="systemCount"></span>
    </div>
    <div>
      <button id="btn-back-galactic" onclick="exitSystemView()" style="display:none">← Back to starmap</button>
      <button id="btn-back-system" onclick="exitOrbitalView()" style="display:none">← Back to system</button>
      <button id="btn-terra" onclick="centerTerra()">Terra</button>
      <span id="zoom">100%</span>
    </div>
  </div>
  <div id="waitBar">
    <span class="waitBar-label">Wait:</span>
    <button onclick="advanceTime(30 * 60)">30m</button>
    <button onclick="advanceTime(1 * 3600)">1h</button>
    <button onclick="advanceTime(6 * 3600)">6h</button>
    <button onclick="advanceTime(1 * 86400)">1d</button>
    <button onclick="waitUntilNextEvent()" class="waitBar-next">⏭ Next event</button>
    <span id="nextEventLabel" class="waitBar-status"></span>
  </div>
  <div id="container">
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div id="jumpOverlay"></div>
    </div>
    <div id="panel">
      <h2>SHIP STATUS</h2>
      <div id="shipCurrent">-</div>
      <div id="shipDrive">-</div>
      <div id="shipPrep"></div>

      <h2 style="margin-top: 16px">SELECTED SYSTEM</h2>
      <div id="systemName">-</div>
      <div id="systemInfo"></div>
      <div id="systemActions"></div>

      <h2 style="margin-top: 16px">CREW ANNOUNCEMENTS</h2>
      <div id="announcementLog"></div>

      <div id="controls">
        Pan: drag<br>
        Zoom: wheel<br>
        Select: click<br>
        Center: dbl-click
      </div>
    </div>
  </div>

  <!-- Background Music -->
  <audio id="bgMusic" loop>
    <source src="https://raw.githubusercontent.com/alecward-coder/battletech/main/Reactor%20Core%20Continuum.mp3" type="audio/mpeg">
  </audio>
  <button id="musicBtn" onclick="toggleMusic()">♪ music on</button>

  <!-- SYS-012 Halden panel -->
  <div id="halden-panel">
    <div id="halden-label">// COMSTAR CHANNEL — PRECENTOR HALDEN</div>
    <div id="halden-response"></div>
    <input id="halden-input" type="text" placeholder="Speak to Halden..."
      onkeydown="if(event.key==='Enter') talkToHalden()">
  </div>

  <script>
    // ─────────────────────────────────────────────
    // MUSIC
    // ─────────────────────────────────────────────
    var bgMusic = document.getElementById('bgMusic');
    var musicBtn = document.getElementById('musicBtn');
    var musicPlaying = true;
    musicBtn.classList.add('playing');

    function setMusicState_(playing) {
      musicPlaying = playing;
      musicBtn.textContent = playing ? '♪ music on' : '♪ music off';
      musicBtn.classList.toggle('playing', playing);
    }

    function tryStartMusic_() {
      // Register the gesture-fallback listeners synchronously up front so
      // they catch any early user interaction even if the initial play()
      // promise rejects asynchronously (Chrome resolves the rejection on
      // a microtask, which can land after the user's first click).
      var resume = function() {
        window.removeEventListener('pointerdown', resume, true);
        window.removeEventListener('keydown',     resume, true);
        window.removeEventListener('wheel',       resume, true);
        bgMusic.play().then(function() { setMusicState_(true); })
                      .catch(function() { setMusicState_(false); });
      };
      window.addEventListener('pointerdown', resume, true);
      window.addEventListener('keydown',     resume, true);
      window.addEventListener('wheel',       resume, true);

      var p = bgMusic.play();
      if (p && typeof p.then === 'function') {
        p.then(function() {
          setMusicState_(true);
          window.removeEventListener('pointerdown', resume, true);
          window.removeEventListener('keydown',     resume, true);
          window.removeEventListener('wheel',       resume, true);
        }).catch(function() {
          setMusicState_(false);
        });
      }
    }
    tryStartMusic_();

    function toggleMusic() {
      if (musicPlaying) {
        bgMusic.pause();
        setMusicState_(false);
      } else {
        bgMusic.play().then(function() { setMusicState_(true); })
                      .catch(function() { setMusicState_(false); });
      }
    }

    // ─────────────────────────────────────────────
    // TIME CONSTANTS
    // ─────────────────────────────────────────────
    var TICKS_PER_SECOND = 1;
    var TICKS_PER_MINUTE = 60;
    var TICKS_PER_HOUR   = 3600;
    var TICKS_PER_DAY    = 86400;

    var FTL_EPOCH_MS = Date.UTC(2108, 11, 1, 0, 0, 0);
    var DEFAULT_START_TICK = Math.floor((Date.UTC(2082, 0, 1) - FTL_EPOCH_MS) / 1000);

    // ─────────────────────────────────────────────
    // CLOCK STATE
    // ─────────────────────────────────────────────
    var simTick = DEFAULT_START_TICK;
    var simYear = 2082;
    var sessionRealStart = Date.now();
    var sessionTickStart = DEFAULT_START_TICK;
    var clockInterval = null;

    // ─────────────────────────────────────────────
    // TC/TST FORMATTER
    // ─────────────────────────────────────────────
    var TC_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun',
                     'Jul','Aug','Sep','Oct','Nov','Dec'];

    function ticksToTC(ticks) {
      var ms = FTL_EPOCH_MS + (ticks * 1000);
      var d  = new Date(ms);
      var day  = d.getUTCDate();
      var mon  = TC_MONTHS[d.getUTCMonth()];
      var year = d.getUTCFullYear();
      var hh   = pad(d.getUTCHours());
      var mm   = pad(d.getUTCMinutes());
      var ss   = pad(d.getUTCSeconds());
      return day + ' ' + mon + ' ' + year + ' / ' + hh + ':' + mm + ':' + ss + ' TST';
    }

    function ticksToYear(ticks) {
      var ms = FTL_EPOCH_MS + (ticks * 1000);
      var d  = new Date(ms);
      return d.getUTCFullYear();
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    // ─────────────────────────────────────────────
    // REVEAL YEAR PARSING
    // ─────────────────────────────────────────────
    function parseRevealYear(revealYear) {
      if (!revealYear || revealYear === '') return 9999;
      var match = String(revealYear).match(/^(\d+)/);
      return match ? parseInt(match[1], 10) : 9999;
    }

    function isSystemRevealed(system, currentYear) {
      var revealNum = parseRevealYear(system.revealYear);
      return currentYear >= revealNum;
    }

    // ─────────────────────────────────────────────
    // CLOCK LOOP
    // ─────────────────────────────────────────────
    function tickClock() {
      var elapsedSeconds = Math.floor((Date.now() - sessionRealStart) / 1000);
      simTick = sessionTickStart + elapsedSeconds + advanceOffsetTicks;
      simYear = ticksToYear(simTick);
      document.getElementById('simClock').textContent = ticksToTC(simTick);
      updateSystemCount();
      // [SYS-013] Drive state machine + tick-driven announcements.
      if (ship) {
        processDueEvents();
        updateShipStatus();
        if (selected) updatePanel();
        updateNextEventLabel();
      }
      // [SYS-014] Redraw so the in-system YOU-> marker actually
      // animates along its transit path each tick (and so the
      // recharge/prep visuals stay live in galactic view).
      draw();
    }

    function startClock() {
      tickClock();
      clockInterval = setInterval(tickClock, 1000);
    }

    // ─────────────────────────────────────────────
    // SAVE / LOAD
    // ─────────────────────────────────────────────
    function initClock() {
      google.script.run
        .withSuccessHandler(function(savedTick) {
          sessionTickStart = (savedTick !== null) ? savedTick : DEFAULT_START_TICK;
          sessionRealStart = Date.now();
          startClock();
        })
        .withFailureHandler(function() {
          sessionTickStart = DEFAULT_START_TICK;
          sessionRealStart = Date.now();
          startClock();
        })
        .getSimTime();
    }

    function saveTime() {
      google.script.run.saveSimTime(simTick);
    }

    setInterval(saveTime, 60000);
    window.addEventListener('beforeunload', saveTime);

    // ─────────────────────────────────────────────
    // SYS-013 MOVEMENT — constants, ship state, state machine
    // ─────────────────────────────────────────────
    var JUMP_RANGE_LY   = 30;
    var RECHARGE_TICKS  = 7 * TICKS_PER_DAY;   // 604800 = 7 days
    var JUMP_PREP_TICKS = 2 * TICKS_PER_HOUR;  // 7200   = 2 hours
    var ship = null;

    // Time-advance offset accumulated by Wait buttons. Added on top
    // of the wall-clock-derived elapsed seconds in tickClock().
    var advanceOffsetTicks = 0;

    // State-machine bookkeeping for one-shot announcements.
    var _lastSeenState     = null;
    var _halfwayFired      = false;
    var _lastPendingTarget = 0;
    var _lastTransitState  = 'IDLE';
    var _lastTransitTarget = '';
    var _transitFinalizing = false;

    function loadShip() {
      google.script.run
        .withSuccessHandler(function(s) {
          ship = s;
          // First load: prime the state-machine flags but suppress
          // initial-state announcements.
          _lastSeenState     = getKfDriveState();
          _lastPendingTarget = Number(ship.pendingJumpTargetId || 0);
          _halfwayFired      = (_lastSeenState !== 'PREPPING') ? true : false;
          _lastTransitState  = ship.transitState || 'IDLE';
          _lastTransitTarget = String(ship.transitTargetId || '');
          renderAnnouncementLog();   // shows "(no announcements yet)" until something fires
          updateShipStatus();
          updatePanel();
          updateNextEventLabel();
          draw();
        })
        .withFailureHandler(function(err) {
          document.getElementById('shipCurrent').textContent = 'ERROR';
          document.getElementById('shipDrive').textContent   = err.message || 'Could not load ship';
        })
        .getPlayerShip();
    }

    function getCurrentSystem() {
      if (!ship || !systems.length) return null;
      for (var i = 0; i < systems.length; i++) {
        if (Number(systems[i].id) === Number(ship.systemId)) return systems[i];
      }
      return null;
    }

    function getPendingTargetSystem() {
      if (!ship || !ship.pendingJumpTargetId) return null;
      for (var i = 0; i < systems.length; i++) {
        if (Number(systems[i].id) === Number(ship.pendingJumpTargetId)) return systems[i];
      }
      return null;
    }

    function distanceLy(a, b) {
      var dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function formatTicks(ticks) {
      var s = Math.max(0, Math.floor(ticks));
      var d = Math.floor(s / TICKS_PER_DAY);     s -= d * TICKS_PER_DAY;
      var h = Math.floor(s / TICKS_PER_HOUR);    s -= h * TICKS_PER_HOUR;
      var m = Math.floor(s / TICKS_PER_MINUTE);
      if (d > 0) return d + 'd ' + h + 'h';
      if (h > 0) return h + 'h ' + m + 'm';
      if (m > 0) return m + 'm';
      return '<1m';
    }

    function getKfDriveState() {
      if (!ship) return 'UNKNOWN';
      var isRecharging = simTick < (Number(ship.lastJumpTick) + RECHARGE_TICKS);
      var hasPrep      = !!ship.pendingJumpTargetId && Number(ship.pendingJumpTargetId) !== 0;
      if (hasPrep) {
        if (isRecharging) return 'RECHARGING';
        if (simTick < Number(ship.jumpPrepEndTime)) return 'PREPPING';
        return 'READY_TO_JUMP';
      }
      if (isRecharging) return 'RECHARGING';
      return 'READY';
    }

    function rechargeRemaining() {
      if (!ship) return 0;
      return Math.max(0, (Number(ship.lastJumpTick) + RECHARGE_TICKS) - simTick);
    }

    function prepRemaining() {
      if (!ship || !ship.pendingJumpTargetId) return 0;
      return Math.max(0, Number(ship.jumpPrepEndTime) - simTick);
    }

    // ─────────────────────────────────────────────
    // SYS-013 — Crew announcement system
    // ─────────────────────────────────────────────
    var ANNOUNCEMENT_TEXT = {
      JUMP_PREP_STARTED:        'All hands, prepare for jump. Secure stations and confirm readiness.',
      JUMP_PREP_HALFWAY:        'Jump preparation is underway. Navigation and engineering teams continue final checks.',
      JUMP_PREP_COMPLETE:       'Jump prep complete. Awaiting command authorization.',
      JUMP_COMMIT:              'Command authorization received. Initiating jump sequence.',
      JUMP_HUM_DEEPENS:         'K-F core hum deepens — felt more than heard. Bridge lighting dims. Static prickles along the hull.',
      JUMP_STARS_SMEAR:         'Stars smear and fold across the viewport. Inner-ear pressure spikes. Brace.',
      JUMP_FLASH_AND_SNAP:      'White flash. Snap through the hull. Viewport dark.',
      JUMP_NEW_STARFIELD:       'Different stars. Position lock acquired. Solar sail redeploying.',
      JUMP_ARRIVAL:             'Jump complete. Confirming position and shipwide status.',
      EMERGENCY_JUMP_INITIATED: 'Emergency jump authorized. Brace for immediate transition.',
      DRIVE_RECHARGE_STARTED:   'K-F drive recharge cycle initiated.',
      DRIVE_RECHARGE_COMPLETE:  'K-F drive recharge complete. Jump capability restored.',
      JUMP_ABORTED:             'Jump preparation aborted. Returning to standard operations.',
      DROPSHIP_DEPARTED:        'Course set. DropShip burn underway.',
      DROPSHIP_ARRIVED:         'Arrival confirmed. DropShip secured at destination.',
      DROPSHIP_ABORTED:         'Transit aborted. DropShip returning to original location.'
    };
    var EMERGENCY_TYPES = { EMERGENCY_JUMP_INITIATED: true };

    var announcementLog = [];   // most-recent first; capped at 8

    function playCrewAnnouncement(eventType, payload) {
      var text = ANNOUNCEMENT_TEXT[eventType] || eventType;
      announcementLog.unshift({
        eventType: eventType,
        text:      text,
        tick:      simTick,
        payload:   payload || null
      });
      if (announcementLog.length > 8) announcementLog.length = 8;
      renderAnnouncementLog();
      console.log('[SYS-013]', eventType, text, payload || '');
    }

    function renderAnnouncementLog() {
      var el = document.getElementById('announcementLog');
      if (!el) return;
      if (!announcementLog.length) {
        el.innerHTML = '<div class="ann-empty">(no announcements yet)</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < announcementLog.length; i++) {
        var a = announcementLog[i];
        var time = formatHHMM(a.tick);
        var cls  = 'ann-row' + (EMERGENCY_TYPES[a.eventType] ? ' ann-emergency' : '');
        html += '<div class="' + cls + '">' +
                  '<span class="ann-time">' + time + '</span>' +
                  '<span class="ann-text">'  + escapeHtml(a.text) + '</span>' +
                '</div>';
      }
      el.innerHTML = html;
    }

    function formatHHMM(ticks) {
      var ms = FTL_EPOCH_MS + (ticks * 1000);
      var d = new Date(ms);
      return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }

    // ─────────────────────────────────────────────
    // SYS-013 — Translation effect: visual overlay + chained beats
    // (per docs/discussions/jump-operations.md §2)
    // ─────────────────────────────────────────────
    function playJumpVisualEffect_() {
      var el = document.getElementById('jumpOverlay');
      if (!el) return;
      // Reset to clear, no transitions, then start the sequence.
      el.style.transition = 'none';
      el.style.background = '#0a0a30';
      el.style.opacity    = '0';
      // Force a reflow so the transition: none takes effect before the
      // next style change actually animates.
      void el.offsetWidth;

      // Phase 1 (0–500ms): pre-distortion — dark blue overlay fades in.
      el.style.transition = 'opacity 0.5s ease, background-color 0.2s ease';
      el.style.opacity    = '0.45';

      // Phase 2 (500–700ms): white flash.
      setTimeout(function() {
        el.style.transition = 'opacity 0.1s ease, background-color 0.1s ease';
        el.style.background = '#ffffff';
        el.style.opacity    = '1';
      }, 500);

      // Phase 3 (700–1200ms): blackout — fade to black.
      setTimeout(function() {
        el.style.transition = 'background-color 0.4s ease';
        el.style.background = '#000000';
      }, 700);

      // Phase 4 (1200–1500ms): clear — fade overlay out.
      setTimeout(function() {
        el.style.transition = 'opacity 0.3s ease';
        el.style.opacity    = '0';
      }, 1200);
    }

    /**
     * Fires the jump bridge-view sequence: opening event (caller-supplied,
     * usually JUMP_COMMIT or EMERGENCY_JUMP_INITIATED), four sensory
     * beats over ~1.1s, then JUMP_ARRIVAL + DRIVE_RECHARGE_STARTED to
     * close. Visual overlay runs in parallel.
     */
    function playJumpSequence_(openingEventType, openingPayload) {
      playJumpVisualEffect_();
      if (openingEventType) playCrewAnnouncement(openingEventType, openingPayload);
      setTimeout(function() { playCrewAnnouncement('JUMP_HUM_DEEPENS');     }, 250);
      setTimeout(function() { playCrewAnnouncement('JUMP_STARS_SMEAR');     }, 550);
      setTimeout(function() { playCrewAnnouncement('JUMP_FLASH_AND_SNAP');  }, 800);
      setTimeout(function() { playCrewAnnouncement('JUMP_NEW_STARFIELD');   }, 1100);
      setTimeout(function() {
        playCrewAnnouncement('JUMP_ARRIVAL');
        playCrewAnnouncement('DRIVE_RECHARGE_STARTED');
      }, 1450);
    }

    // ─────────────────────────────────────────────
    // SYS-013 — Tick-driven event processor
    // (called every simulation tick + after time advances)
    // ─────────────────────────────────────────────
    function processDueEvents() {
      if (!ship) return;

      // Reset halfway one-shot when the prep target changes
      var pending = Number(ship.pendingJumpTargetId || 0);
      if (pending !== _lastPendingTarget) {
        _halfwayFired      = (pending === 0);
        _lastPendingTarget = pending;
      }

      var newState = getKfDriveState();

      // Halfway one-shot during PREPPING
      if (newState === 'PREPPING' && !_halfwayFired) {
        var halfwayTick = Number(ship.jumpPrepEndTime) - (JUMP_PREP_TICKS / 2);
        if (simTick >= halfwayTick) {
          playCrewAnnouncement('JUMP_PREP_HALFWAY');
          _halfwayFired = true;
        }
      }

      // State-transition announcements (only the tick-driven ones —
      // action-driven transitions emit their own announcements
      // imperatively in the action handlers).
      if (newState !== _lastSeenState) {
        if (_lastSeenState === 'PREPPING' && newState === 'READY_TO_JUMP') {
          playCrewAnnouncement('JUMP_PREP_COMPLETE');
        }
        if (_lastSeenState === 'RECHARGING' && newState === 'READY') {
          playCrewAnnouncement('DRIVE_RECHARGE_COMPLETE');
        }
        _lastSeenState = newState;
      }

      // [SYS-014] Transit completion: when client time crosses the
      // ship's transitEndTick, ask the server to finalize. The
      // success handler bumps the local ship state to the new
      // location and fires DROPSHIP_ARRIVED.
      if (ship.transitState === 'TRANSITING' &&
          simTick >= Number(ship.transitEndTick) &&
          !_transitFinalizing) {
        _transitFinalizing = true;
        google.script.run
          .withSuccessHandler(function(result) {
            _transitFinalizing = false;
            if (result && result.finalized) {
              ship = result.ship;
              playCrewAnnouncement('DROPSHIP_ARRIVED');
              _lastTransitState  = 'IDLE';
              _lastTransitTarget = '';
              updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
            } else if (result && result.ship) {
              ship = result.ship;
            }
          })
          .withFailureHandler(function() { _transitFinalizing = false; })
          .finalizeTransit(simTick);
      }
    }

    // ─────────────────────────────────────────────
    // SYS-013 — Time advance
    // ─────────────────────────────────────────────
    function advanceTime(ticks) {
      advanceOffsetTicks += Number(ticks);
      tickClock();         // recompute simTick + fire processDueEvents
      saveTime();          // persist immediately so reload picks up the advance
      updatePanel();
      updateNextEventLabel();
    }

    function getNextPendingEventTime() {
      if (!ship) return null;
      var candidates = [];
      var state = getKfDriveState();

      if (state === 'PREPPING') {
        var halfway = Number(ship.jumpPrepEndTime) - (JUMP_PREP_TICKS / 2);
        if (simTick < halfway && !_halfwayFired) candidates.push({ time: halfway, label: 'jump prep halfway' });
        if (simTick < Number(ship.jumpPrepEndTime)) {
          candidates.push({ time: Number(ship.jumpPrepEndTime), label: 'jump prep complete' });
        }
      }
      if (state === 'RECHARGING') {
        candidates.push({ time: Number(ship.lastJumpTick) + RECHARGE_TICKS, label: 'drive recharge complete' });
      }
      // [SYS-014] In-system transit
      if (ship.transitState === 'TRANSITING' && simTick < Number(ship.transitEndTick)) {
        candidates.push({ time: Number(ship.transitEndTick), label: 'transit complete' });
      }

      if (!candidates.length) return null;
      // Earliest event wins.
      candidates.sort(function(a, b) { return a.time - b.time; });
      return candidates[0];
    }

    function waitUntilNextEvent() {
      var next = getNextPendingEventTime();
      if (!next) {
        updateNextEventLabel('No pending timed actions.');
        return;
      }
      var delta = Math.max(0, next.time - simTick) + 1; // +1 to land just past the threshold
      advanceTime(delta);
    }

    function updateNextEventLabel(text) {
      var el = document.getElementById('nextEventLabel');
      if (!el) return;
      if (typeof text === 'string') { el.textContent = text; return; }
      var next = getNextPendingEventTime();
      if (!next) { el.textContent = ''; return; }
      el.textContent = 'Next: ' + next.label + ' in ' + formatTicks(next.time - simTick);
    }

    // ─────────────────────────────────────────────
    // SYS-013 — Ship-status panel
    // ─────────────────────────────────────────────
    function updateShipStatus() {
      if (!ship) return;
      var currentSys = getCurrentSystem();
      var locName    = inSystemLocationName_(ship.locationId);
      var atLine     = 'At: ' + (locName || '(unknown)') +
                       (currentSys ? ', ' + currentSys.name + ' system' : '');
      document.getElementById('shipCurrent').textContent = atLine;

      var driveEl = document.getElementById('shipDrive');
      var prepEl  = document.getElementById('shipPrep');
      var state   = getKfDriveState();

      switch (state) {
        case 'READY':
          driveEl.textContent = 'K-F drive: ready' +
            (ship.locationKind === 'jump_point' ? '' : ' (need to be at a jump point)');
          driveEl.style.color = ship.locationKind === 'jump_point' ? '#0fa' : '#aa6';
          prepEl.textContent  = '';
          break;
        case 'PREPPING':
          var pendT = getPendingTargetSystem();
          driveEl.textContent = 'K-F drive: prepping';
          driveEl.style.color = '#cf8';
          prepEl.textContent  = 'Target: ' + (pendT ? pendT.name : '#' + ship.pendingJumpTargetId) +
                                ' · prep complete in ' + formatTicks(prepRemaining());
          break;
        case 'READY_TO_JUMP':
          var pT = getPendingTargetSystem();
          driveEl.textContent = 'K-F drive: ready to jump';
          driveEl.style.color = '#cf8';
          prepEl.textContent  = 'Target: ' + (pT ? pT.name : '#' + ship.pendingJumpTargetId) +
                                ' · awaiting command authorization';
          break;
        case 'RECHARGING':
          driveEl.textContent = 'K-F drive: recharging — ' + formatTicks(rechargeRemaining());
          driveEl.style.color = '#888';
          prepEl.textContent  = '';
          break;
        default:
          driveEl.textContent = 'K-F drive: ' + state.toLowerCase();
          driveEl.style.color = '#888';
          prepEl.textContent  = '';
      }

      // [SYS-014] Transit status (overrides prep line if both are
      // happening — they shouldn't, but be defensive).
      if (ship.transitState === 'TRANSITING') {
        var targetName = inSystemLocationName_(ship.transitTargetId);
        var remaining  = Math.max(0, Number(ship.transitEndTick) - simTick);
        prepEl.textContent = 'In transit to ' + (targetName || ship.transitTargetId) +
                             ' · arriving in ' + formatTicks(remaining);
      }
    }

    // Resolve a location ID to a friendly name. Looks at the loaded
    // systemViewLayout if we're currently viewing the system; falls
    // back to a canon-friendly label for synthetic jump-point ids
    // (every system has standard zenith / nadir per canon, even
    // when not explicitly seeded).
    function inSystemLocationName_(locId) {
      if (!locId) return '';
      if (systemViewLayout && systemViewLayout.byId && systemViewLayout.byId[locId]) {
        return systemViewLayout.byId[locId].name;
      }
      if (systemViewData) {
        var pools = [systemViewData.bodies || [], systemViewData.jumpPoints || [], systemViewData.infrastructure || []];
        for (var p = 0; p < pools.length; p++) {
          for (var i = 0; i < pools[p].length; i++) {
            var x = pools[p][i];
            var id = x.body_id || x.jump_point_id || x.facility_id;
            if (id === locId) return x.body_name || x.jump_point_name || x.facility_name;
          }
        }
      }
      // Friendly fallback for synthetic jump-point ids
      var s = String(locId);
      if (/-jp-zenith$/.test(s)) return 'Standard Zenith Jump Point';
      if (/-jp-nadir$/.test(s))  return 'Standard Nadir Jump Point';
      if (s.indexOf('-jp-') !== -1) return 'Jump Point';
      return locId;
    }

    // ─────────────────────────────────────────────
    // SYS-013 — Action handlers
    // ─────────────────────────────────────────────
    function beginJumpPrep() {
      if (!selected || !ship) return;
      _setActionsBusy('Starting jump prep...');
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.ok) {
            ship = result.ship;
            playCrewAnnouncement('JUMP_PREP_STARTED');
            _lastSeenState = getKfDriveState();
            _halfwayFired  = false;
            updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
          } else {
            alert(_describeFailure(result));
            updatePanel();
          }
        })
        .withFailureHandler(function(err) {
          alert('Begin-prep error: ' + err.message);
          updatePanel();
        })
        .beginJumpPrep(selected.id, simTick);
    }

    function commitJumpAction() {
      if (!ship) return;
      _setActionsBusy('Committing jump...');
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.ok) {
            ship = result.ship;
            playJumpSequence_('JUMP_COMMIT');
            _lastSeenState = getKfDriveState();
            updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
          } else {
            alert(_describeFailure(result));
            updatePanel();
          }
        })
        .withFailureHandler(function(err) {
          alert('Commit-jump error: ' + err.message);
          updatePanel();
        })
        .commitJump(simTick);
    }

    function emergencyJumpAction() {
      if (!selected || !ship) return;
      if (!confirm('Emergency jump bypasses prep and is logged as a risk event. Proceed?')) return;
      _setActionsBusy('Emergency jump...');
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.ok) {
            ship = result.ship;
            playJumpSequence_('EMERGENCY_JUMP_INITIATED', result.risk);
            _lastSeenState = getKfDriveState();
            updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
          } else {
            alert(_describeFailure(result));
            updatePanel();
          }
        })
        .withFailureHandler(function(err) {
          alert('Emergency-jump error: ' + err.message);
          updatePanel();
        })
        .emergencyJump(selected.id, simTick);
    }

    function abortJumpPrepAction() {
      if (!ship) return;
      _setActionsBusy('Aborting prep...');
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.ok) {
            ship = result.ship;
            playCrewAnnouncement('JUMP_ABORTED');
            _lastSeenState = getKfDriveState();
            _halfwayFired  = true; // no halfway to fire after abort
            updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
          } else {
            alert(_describeFailure(result));
            updatePanel();
          }
        })
        .withFailureHandler(function(err) {
          alert('Abort error: ' + err.message);
          updatePanel();
        })
        .abortJumpPrep(simTick);
    }

    function setStartHere() {
      if (!selected) return;
      google.script.run
        .withSuccessHandler(function(s) {
          ship = s;
          _lastSeenState     = getKfDriveState();
          _halfwayFired      = true;
          _lastPendingTarget = 0;
          updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
        })
        .setPlayerLocation(selected.id);
    }

    function _describeFailure(result) {
      var msg = 'Action failed: ' + result.reason;
      if (result.reason === 'recharging') {
        msg += ' (' + formatTicks(result.ticksRemaining) + ' remaining)';
      } else if (result.reason === 'out_of_range') {
        msg += ' (' + result.distance.toFixed(1) + ' / ' + result.range + ' LY)';
      } else if (result.state) {
        msg += ' (current state: ' + result.state + ')';
      }
      return msg;
    }

    function _setActionsBusy(label) {
      var actionsEl = document.getElementById('systemActions');
      if (!actionsEl) return;
      var btns = actionsEl.querySelectorAll('button');
      for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
      // Don't change labels — just disable. Server response will repaint.
    }

    // ─────────────────────────────────────────────
    // STARMAP
    // ─────────────────────────────────────────────
    var systems = [];
    var view = { x: 0, y: 0, scale: 0.5 };
    var selected = null;
    var hovered = null;
    var drag = null;
    var canvas, ctx, width, height;

    // [SYS-014] In-system view state
    var currentView       = 'galactic';   // 'galactic' | 'system' | 'orbital'
    var systemViewData    = null;         // bundle from getStarSystemView
    var systemViewLayout  = null;         // computed positions { entities, routes, byId }
    var selectedEntity    = null;         // selected in system view / orbital view
    var hoveredEntity     = null;
    var galacticState     = null;         // saved view + selected when entering system view
    var orbitalLayout     = null;         // computed positions for orbital (planet-centric) view
    var systemViewState   = null;         // saved view when entering orbital view

    // [SYS-014] Seamless zoom-driven view transitions
    // The cross-fade fires when the galactic dot reaches the same pixel
    // radius the zenith ring has at default system-view scale (475 px).
    // At GALACTIC_DOT_COEFF=2 that requires view.scale ≈ 237.5×.
    var SYSTEM_AUTO_EXIT_SCALE    = 0.15;
    var GALACTIC_RETURN_SCALE     = 4;
    var TRANSITION_FADE_MS        = 450;
    var POST_ENTER_EXIT_LOCK_MS   = 700;  // suppress auto-exit briefly after entry
    var isTransitioningViews      = false;
    var transitionState           = null; // active fade animation, see beginGalacticToSystemTransition_
    var transitionRafId           = null;
    var exitLockUntil             = 0;    // performance.now() timestamp; auto-exit blocked until then

    google.script.run.withSuccessHandler(function(data) {
      systems = data;
      draw();
      updateSystemCount();
      loadShip();
    }).getSystems();

    function updateSystemCount() {
      var visible = systems.filter(function(s) { return isSystemRevealed(s, simYear); }).length;
      document.getElementById('systemCount').textContent = visible + ' / ' + systems.length + ' systems';
    }

    window.onload = function() {
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');
      resize();
      window.addEventListener('resize', resize);
      canvas.addEventListener('mousedown', onMouseDown);
      canvas.addEventListener('mousemove', onMouseMove);
      canvas.addEventListener('mouseup', onMouseUp);
      canvas.addEventListener('mouseleave', onMouseUp);
      canvas.addEventListener('click', onClick);
      canvas.addEventListener('dblclick', onDblClick);
      canvas.addEventListener('wheel', onWheel);
      initClock();
    };

    function resize() {
      var wrap = document.getElementById('canvasWrap');
      var rect = wrap.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width;
      canvas.height = height;
      draw();
    }

    function worldToScreen(wx, wy) {
      return {
        x: width/2 + (wx + view.x) * view.scale,
        y: height/2 - (wy + view.y) * view.scale
      };
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx - width/2) / view.scale - view.x,
        y: -((sy - height/2) / view.scale) - view.y
      };
    }

    function findSystemAt(sx, sy) {
      var w = screenToWorld(sx, sy);
      var r = 10 / view.scale;
      for (var i = 0; i < systems.length; i++) {
        var s = systems[i];
        if (!isSystemRevealed(s, simYear)) continue;
        var dx = s.x - w.x, dy = s.y - w.y;
        if (Math.sqrt(dx*dx + dy*dy) < r) return s;
      }
      return null;
    }

    // ─────────────────────────────────────────────
    // SYS-014 — In-system view: enter / exit / layout / draw
    // ─────────────────────────────────────────────
    var SYS_BAND_R    = { inner: 110, habitable: 230, outer: 440, deep_outer: 740 };
    var SYS_JP_R      = 950;
    var SYS_MOON_R    = 28;
    var SYS_FAC_OFF   = 22;

    // ─────────────────────────────────────────────
    // [SYS-014] Real Sol orbital elements
    // Periods are sidereal in Earth days. L0 is the ecliptic mean longitude
    // (deg) at J2000.0 (2000-01-01 12:00 UT). Planet radii are real semi-
    // major axes scaled at SOL_AU_PX px/AU. Moon distances are stylized
    // (real distances would render sub-pixel) but periods are real.
    // ─────────────────────────────────────────────
    var SOL_AU_PX = 28;
    var SOL_PLANET_ORBITS = {
      '2371-mercury': { period: 87.969,    L0: 252.25166, a_au: 0.387 },
      '2371-venus':   { period: 224.701,   L0: 181.97970, a_au: 0.723 },
      '2371-terra':   { period: 365.256,   L0: 100.46435, a_au: 1.000 },
      '2371-mars':    { period: 686.971,   L0: 355.43332, a_au: 1.524 },
      '2371-jupiter': { period: 4332.589,  L0:  34.40438, a_au: 5.203 },
      '2371-saturn':  { period: 10759.22,  L0:  49.94432, a_au: 9.537 },
      '2371-uranus':  { period: 30688.5,   L0: 313.23218, a_au: 19.191 },
      '2371-neptune': { period: 60182,     L0: 304.88003, a_au: 30.069 }
    };
    var SOL_MOON_ORBITS = {
      // Real semi-major axes in AU. Periods are sidereal Earth days. L0 is
      // a placeholder spread (not astronomically grounded); real moon
      // ephemerides drift relative to a global epoch and aren't worth the
      // complexity for visual purposes. Used as a transitional fallback
      // until the spreadsheet rows carry these fields directly.
      '2371-luna':     { period: 27.3217,  L0:   0, parent: '2371-terra',   a_au: 0.002570 },
      '2371-phobos':   { period: 0.31891,  L0:   0, parent: '2371-mars',    a_au: 0.0000627 },
      '2371-deimos':   { period: 1.26244,  L0:  90, parent: '2371-mars',    a_au: 0.0001569 },
      '2371-io':       { period: 1.76914,  L0:   0, parent: '2371-jupiter', a_au: 0.002819 },
      '2371-europa':   { period: 3.55118,  L0:  60, parent: '2371-jupiter', a_au: 0.004486 },
      '2371-ganymede': { period: 7.15455,  L0: 120, parent: '2371-jupiter', a_au: 0.007155 },
      '2371-callisto': { period: 16.6890,  L0: 200, parent: '2371-jupiter', a_au: 0.012587 },
      '2371-titan':    { period: 15.9454,  L0:   0, parent: '2371-saturn',  a_au: 0.008168 }
    };
    var J2000_MS = Date.UTC(2000, 0, 1, 12, 0, 0);
    function daysSinceJ2000_() {
      return (FTL_EPOCH_MS + simTick * 1000 - J2000_MS) / 86400000;
    }

    // ─── SYS-014b: Sheet-driven orbital params ────────────────────
    // Reads orbital and physical parameters from a Celestial_Bodies row,
    // falling back to the JS lookup tables above when the migration hasn't
    // been run yet on the spreadsheet. Once the data is fully populated
    // these JS tables can be removed.
    function _bodyOrbitFromRow_(b) {
      if (!b) return null;
      var period = Number(b.orbital_period_days);
      var a_au   = Number(b.semi_major_axis_au);
      if (!isFinite(period) || period <= 0) return null;
      if (!isFinite(a_au)   || a_au   <= 0) return null;
      var L0 = Number(b.orbital_l0_deg);
      if (!isFinite(L0)) L0 = 0;
      return { a_au: a_au, period: period, L0: L0 };
    }
    function _bodyOrbit_(b) {
      var fromRow = _bodyOrbitFromRow_(b);
      if (fromRow) return fromRow;
      if (!b) return null;
      var key = String(b.body_id || '').trim();
      return SOL_PLANET_ORBITS[key] || null;
    }
    function _bodyMoonOrbit_(b) {
      var fromRow = _bodyOrbitFromRow_(b);
      if (fromRow) {
        fromRow.parent = String(b.orbit_parent_id || '').trim();
        return fromRow;
      }
      if (!b) return null;
      return SOL_MOON_ORBITS[String(b.body_id || '').trim()] || null;
    }
    function _bodyRadiusKm_(bodyOrId) {
      if (bodyOrId && typeof bodyOrId === 'object') {
        var r = Number(bodyOrId.body_radius_km);
        if (isFinite(r) && r > 0) return r;
        return SOL_BODY_RADIUS_KM[String(bodyOrId.body_id || '').trim()] || null;
      }
      return SOL_BODY_RADIUS_KM[String(bodyOrId || '').trim()] || null;
    }

    function enterSystemView(systemId) {
      var sysEntry = null;
      for (var i = 0; i < systems.length; i++) {
        if (Number(systems[i].id) === Number(systemId)) { sysEntry = systems[i]; break; }
      }
      if (!sysEntry) { isTransitioningViews = false; return; }
      if (!sysEntry.hasSystemView) {
        alert('No in-system data for ' + sysEntry.name + ' yet.');
        isTransitioningViews = false;
        return;
      }
      // Save galactic state to restore on exit
      galacticState = {
        view:     { x: view.x, y: view.y, scale: view.scale },
        selected: selected,
        hovered:  hovered
      };
      google.script.run
        .withSuccessHandler(function(bundle) {
          if (!bundle || !bundle.system) {
            alert('Failed to load system data for ' + sysEntry.name + '.');
            galacticState = null;
            isTransitioningViews = false;
            return;
          }
          systemViewData   = bundle;
          systemViewLayout = computeSystemLayout_(bundle);
          currentView      = 'system';
          selectedEntity   = null;
          hoveredEntity    = null;
          // Reset view to fit the whole system
          view = { x: 0, y: 0, scale: 0.5 };
          // UI chrome
          document.getElementById('viewTitle').textContent =
            (bundle.system.system_name || sysEntry.name) + ' — System View';
          document.getElementById('btn-back-galactic').style.display = '';
          document.getElementById('btn-terra').style.display = 'none';
          updatePanel();
          draw();
          isTransitioningViews = false;
        })
        .withFailureHandler(function(err) {
          alert('System view error: ' + (err && err.message ? err.message : err));
          galacticState = null;
          isTransitioningViews = false;
        })
        .getStarSystemView(sysEntry.id);
    }

    function exitSystemView(opts) {
      opts = opts || {};
      var exitedSystemId = systemViewData && systemViewData.system
        ? systemViewData.system.system_id : null;
      currentView      = 'galactic';
      systemViewData   = null;
      systemViewLayout = null;
      selectedEntity   = null;
      hoveredEntity    = null;
      if (opts.autoZoom) {
        // Zoom-out exit: center on the system we just left at a moderate scale
        // that's safely below GALACTIC_AUTO_ENTER_SCALE so we don't immediately
        // re-enter on the next wheel tick.
        var s = null;
        if (exitedSystemId !== null) {
          for (var i = 0; i < systems.length; i++) {
            if (Number(systems[i].id) === Number(exitedSystemId)) { s = systems[i]; break; }
          }
        }
        view = s
          ? { x: -s.x, y: -s.y, scale: GALACTIC_RETURN_SCALE }
          : { x: 0, y: 0, scale: 0.5 };
        selected = s || (galacticState && galacticState.selected) || null;
        hovered  = null;
        galacticState = null;
      } else if (galacticState) {
        view     = galacticState.view;
        selected = galacticState.selected;
        hovered  = galacticState.hovered;
        galacticState = null;
      }
      document.getElementById('viewTitle').textContent = 'Phase 0 Starmap';
      document.getElementById('btn-back-galactic').style.display = 'none';
      document.getElementById('btn-terra').style.display = '';
      updatePanel();
      draw();
      isTransitioningViews = false;
    }

    function computeSystemLayout_(data) {
      var entities = [];
      var byId     = {};
      // Sol gets real orbital motion; other systems keep the stylized
      // concentric-band layout for now.
      var hasOrbits = (data.system && Number(data.system.system_id) === 2371);

      // Normalize IDs once. Sheet round-trips occasionally inject leading or
      // trailing whitespace, which silently breaks any byId lookup of the
      // canonical ID. Trim every id-like field on every row up front.
      function _trimIds(rows, fields) {
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          if (!r) continue;
          for (var j = 0; j < fields.length; j++) {
            var f = fields[j];
            if (r[f] !== undefined && r[f] !== null) r[f] = String(r[f]).trim();
          }
        }
      }
      _trimIds(data.bodies || [],
        ['body_id', 'system_id', 'orbit_parent_id', 'body_type']);
      _trimIds(data.jumpPoints || [],
        ['jump_point_id', 'system_id', 'associated_body_id', 'jump_point_type']);
      _trimIds(data.infrastructure || [],
        ['facility_id', 'system_id', 'orbiting_body_id', 'location_type']);
      _trimIds(data.routes || [],
        ['route_id', 'system_id',
         'origin_location_id', 'origin_location_type',
         'destination_location_id', 'destination_location_type']);

      // Locate the star
      var starBody = null;
      for (var i = 0; i < data.bodies.length; i++) {
        if (data.bodies[i].body_type === 'star') { starBody = data.bodies[i]; break; }
      }

      // 1. Star at center
      var starEnt = {
        kind: 'star',
        id:   starBody ? starBody.body_id : 'star',
        name: starBody ? starBody.body_name : (data.system.primary_star_name || data.system.system_name),
        x: 0, y: 0,
        raw: starBody || {}
      };
      entities.push(starEnt);
      if (starBody) byId[starBody.body_id] = starEnt;

      // 2. Bodies orbiting the star, grouped by band
      var byBand = { inner: [], habitable: [], outer: [], deep_outer: [] };
      for (var i = 0; i < data.bodies.length; i++) {
        var b = data.bodies[i];
        if (b.body_type === 'star') continue;
        if (!starBody || b.orbit_parent_id !== starBody.body_id) continue;
        var band = b.orbit_band && byBand[b.orbit_band] !== undefined ? b.orbit_band : 'outer';
        byBand[band].push(b);
      }
      for (var bandName in byBand) {
        var arr = byBand[bandName];
        arr.sort(function(a, b) { return Number(a.orbit_order || 0) - Number(b.orbit_order || 0); });
        var R = SYS_BAND_R[bandName] || 500;
        for (var k = 0; k < arr.length; k++) {
          var b   = arr[k];
          var orb = hasOrbits ? _bodyOrbit_(b) : null;
          var ringR = orb ? (orb.a_au * SOL_AU_PX) : R;
          var ang   = orb ? 0 : ((2 * Math.PI * k) / Math.max(arr.length, 1) - Math.PI / 2);
          var ent = {
            kind: (b.body_type === 'asteroid_belt') ? 'asteroid_belt' : 'planet',
            id:   b.body_id, name: b.body_name,
            x:    ringR * Math.cos(ang), y: ringR * Math.sin(ang),
            ringRadius: ringR,
            orbit: orb || null,
            raw: b
          };
          entities.push(ent);
          byId[b.body_id] = ent;
        }
      }

      // 3. Moons clustered around their parent planet
      var moonsByParent = {};
      for (var i = 0; i < data.bodies.length; i++) {
        var b = data.bodies[i];
        if (b.body_type !== 'moon') continue;
        if (!moonsByParent[b.orbit_parent_id]) moonsByParent[b.orbit_parent_id] = [];
        moonsByParent[b.orbit_parent_id].push(b);
      }
      for (var pid in moonsByParent) {
        var parent = byId[pid];
        if (!parent) continue;
        var siblings = moonsByParent[pid];
        siblings.sort(function(a, b) { return Number(a.orbit_order || 0) - Number(b.orbit_order || 0); });
        for (var i = 0; i < siblings.length; i++) {
          var m    = siblings[i];
          var morb = hasOrbits ? _bodyMoonOrbit_(m) : null;
          // Heliocentric system view shows moons clumped at their parent
          // anyway (real moon distances render sub-pixel here), so just
          // use the stylized SYS_MOON_R when we have orbital data — the
          // moons get hidden by isHeliocentricEntity_ regardless.
          var moonR = SYS_MOON_R;
          var mang  = morb ? 0 : ((2 * Math.PI * i) / Math.max(siblings.length, 1));
          var ent = {
            kind: 'moon', id: m.body_id, name: m.body_name,
            x: parent.x + moonR * Math.cos(mang),
            y: parent.y + moonR * Math.sin(mang),
            moonOrbit: morb || null,
            parentId:  morb ? morb.parent : pid,
            raw: m
          };
          entities.push(ent);
          byId[m.body_id] = ent;
        }
      }

      // 4. Jump points. `scope` (data column) decides system vs orbital
      // placement explicitly; falls back to type-based defaults when blank.
      for (var i = 0; i < data.jumpPoints.length; i++) {
        var jp = data.jumpPoints[i];
        var x, y;
        var parentRelative = null;
        var jpType  = String(jp.jump_point_type || '').trim().toLowerCase();
        var jpScope = String(jp.scope || '').trim().toLowerCase();
        if (!jpScope) jpScope = (jpType === 'pirate_point') ? 'planet' : 'system';

        if (jpScope === 'planet') {
          var parent = byId[String(jp.associated_body_id || '').trim()];
          if (parent) {
            var pAng    = Math.atan2(parent.y, parent.x);
            var pRadius = Math.sqrt(parent.x * parent.x + parent.y * parent.y);
            x = (pRadius + 60) * Math.cos(pAng + 0.4);
            y = (pRadius + 60) * Math.sin(pAng + 0.4);
            parentRelative = { parentId: jp.associated_body_id, mode: 'pirate', radial: 60, angular: 0.4 };
          } else {
            x = SYS_JP_R * 0.7; y = SYS_JP_R * 0.7;
          }
        } else if (jpType === 'zenith') {
          x = 0; y = SYS_JP_R;
        } else if (jpType === 'nadir') {
          x = 0; y = -SYS_JP_R;
        } else {
          x = -SYS_JP_R; y = 0;   // generic / lagrange — left side
        }
        var ent = {
          kind: 'jump_point', id: jp.jump_point_id, name: jp.jump_point_name,
          x: x, y: y, raw: jp,
          parentRelative: parentRelative
        };
        entities.push(ent);
        byId[jp.jump_point_id] = ent;
      }

      // 5. Orbital infrastructure — offset from associated body, or near zenith if deep_space
      for (var i = 0; i < data.infrastructure.length; i++) {
        var f = data.infrastructure[i];
        var parent = f.orbiting_body_id ? byId[f.orbiting_body_id] : null;
        var x, y;
        var parentRel = null;
        if (parent) {
          var ang = (i * 0.7) + Math.PI / 4;   // semi-deterministic offset
          x = parent.x + SYS_FAC_OFF * Math.cos(ang);
          y = parent.y + SYS_FAC_OFF * Math.sin(ang);
          parentRel = { parentId: f.orbiting_body_id, mode: 'cartesian',
                        ox: SYS_FAC_OFF * Math.cos(ang), oy: SYS_FAC_OFF * Math.sin(ang) };
        } else {
          // Deep-space facility: place near the default arrival point (zenith) if known
          var zen = byId[data.system.default_arrival_point];
          if (zen) { x = zen.x + 30; y = zen.y - 20; }
          else     { x = 0; y = SYS_JP_R - 60; }
        }
        var ent = {
          kind: 'infrastructure', id: f.facility_id, name: f.facility_name,
          x: x, y: y, raw: f,
          parentRelative: parentRel
        };
        entities.push(ent);
        byId[f.facility_id] = ent;
      }

      // 6. Routes — store endpoint IDs so live orbital motion updates the lines
      var routes = [];
      for (var i = 0; i < data.routes.length; i++) {
        var r      = data.routes[i];
        var origin = byId[r.origin_location_id];
        var dest   = byId[r.destination_location_id];
        if (!origin || !dest) continue;
        routes.push({
          id:  r.route_id,
          originId: r.origin_location_id,
          destId:   r.destination_location_id,
          x1:  origin.x, y1: origin.y,
          x2:  dest.x,   y2: dest.y,
          raw: r
        });
      }

      return {
        entities: entities, routes: routes, byId: byId, star: starEnt,
        hasOrbits: hasOrbits
      };
    }

    // Updates entity positions in the layout for the current sim time using
    // real Sol orbital elements. Order matters: planets first (around star),
    // then moons (around planets), then anything that follows a parent —
    // pirate jump points (parent-relative angular offset) and orbital
    // infrastructure (parent-relative cartesian offset).
    function applyOrbits_(layout) {
      if (!layout || !layout.hasOrbits || !layout.entities) return;
      var t   = daysSinceJ2000_();
      var DEG = Math.PI / 180;

      // 1. Planets around the star
      for (var i = 0; i < layout.entities.length; i++) {
        var ent = layout.entities[i];
        var orb = ent.orbit;
        if (!orb) continue;
        var L = (orb.L0 + 360 * (t / orb.period)) * DEG;
        var R = orb.a_au * SOL_AU_PX;
        ent.x = R * Math.cos(L);
        ent.y = R * Math.sin(L);
        ent.ringRadius = R;
      }

      // 2. Moons relative to their parent planet
      for (var i = 0; i < layout.entities.length; i++) {
        var ent  = layout.entities[i];
        var morb = ent.moonOrbit;
        if (!morb) continue;
        var parent = layout.byId[morb.parent];
        if (!parent) continue;
        var Lm = (morb.L0 + 360 * (t / morb.period)) * DEG;
        ent.x = parent.x + morb.a_px * Math.cos(Lm);
        ent.y = parent.y + morb.a_px * Math.sin(Lm);
      }

      // 3. Pirate jump points and parent-relative infrastructure
      for (var i = 0; i < layout.entities.length; i++) {
        var ent = layout.entities[i];
        var pr  = ent.parentRelative;
        if (!pr) continue;
        var parent = layout.byId[pr.parentId];
        if (!parent) continue;
        if (pr.mode === 'pirate') {
          var pAng    = Math.atan2(parent.y, parent.x);
          var pRadius = Math.sqrt(parent.x * parent.x + parent.y * parent.y);
          ent.x = (pRadius + pr.radial) * Math.cos(pAng + pr.angular);
          ent.y = (pRadius + pr.radial) * Math.sin(pAng + pr.angular);
        } else if (pr.mode === 'cartesian') {
          ent.x = parent.x + pr.ox;
          ent.y = parent.y + pr.oy;
        }
      }
    }

    // ─────────────────────────────────────────────
    // [SYS-014] Orbital view — centered on a single body, showing its
    // satellites + parent-relative jump points + orbital infrastructure at
    // realistic semi-major axes auto-scaled to fit the canvas.
    // ─────────────────────────────────────────────
    var KM_PER_AU             = 149597870.7;
    var ORBITAL_FIT_RADIUS_PX = 380;   // outer satellite sits roughly here
    var ORBITAL_BODY_MIN_PX   = 10;    // floor on the central body's pixel radius
    // Real body radii (km). Used by the orbital view to draw the central
    // body at correct scale relative to its satellites — important so e.g.
    // Phobos clearly orbits just above Mars's surface.
    var SOL_BODY_RADIUS_KM = {
      '2371-mercury':  2440, '2371-venus':    6052, '2371-terra':    6371,
      '2371-mars':     3390, '2371-jupiter': 69911, '2371-saturn':  58232,
      '2371-uranus':  25362, '2371-neptune': 24622,
      '2371-luna':     1737, '2371-phobos':     11, '2371-deimos':      6,
      '2371-io':       1822, '2371-europa':   1561, '2371-ganymede': 2634,
      '2371-callisto': 2410, '2371-titan':    2575
    };

    // Build an orbital layout for `centerBody` (an entity from the system
    // layout). Pulls satellites, pirate JPs, and infrastructure from the
    // already-loaded systemViewData. All positions are in this view's local
    // frame (parent at world origin); a body-specific scalePxPerAU keeps
    // the outermost satellite near ORBITAL_FIT_RADIUS_PX.
    function computeOrbitalLayout_(centerBody) {
      if (!systemViewData || !centerBody) return null;
      var entities = [];
      var byId     = {};
      var centerId = centerBody.id;

      var centerEnt = {
        kind: centerBody.kind,
        id:   centerBody.id,
        name: centerBody.name,
        x: 0, y: 0,
        raw: centerBody.raw || {}
      };
      entities.push(centerEnt);
      byId[centerEnt.id] = centerEnt;

      // Collect satellites of this body. Source them from the system layout's
      // already-built moon entities — those have a known-good parent match
      // (the system view rendered them correctly before we hid moons in
      // heliocentric view) and carry the resolved moonOrbit reference.
      var sats = [];
      var centerIdStr = String(centerId).trim();
      if (systemViewLayout && systemViewLayout.entities) {
        for (var i = 0; i < systemViewLayout.entities.length; i++) {
          var se = systemViewLayout.entities[i];
          if (!se || se.kind !== 'moon') continue;
          if (String(se.parentId || '').trim() !== centerIdStr) continue;
          sats.push(se.raw || { body_id: se.id, body_name: se.name });
        }
      }
      // Fallback: if no moon entities in the system layout, scan the bundle
      // directly. This covers any edge case where the layout is incomplete.
      if (sats.length === 0) {
        for (var i = 0; i < systemViewData.bodies.length; i++) {
          var b = systemViewData.bodies[i];
          if (!b) continue;
          var bt = String(b.body_type || '').trim().toLowerCase();
          if (bt !== 'moon') continue;
          if (String(b.orbit_parent_id || '').trim() !== centerIdStr) continue;
          sats.push(b);
        }
      }
      sats.sort(function(a, b) { return Number(a.orbit_order || 0) - Number(b.orbit_order || 0); });

      // Determine maximum semi-major axis (AU) among real satellites; fall
      // back to a reasonable default for bodies without orbital data.
      var maxAu = 0;
      for (var i = 0; i < sats.length; i++) {
        var orb = _bodyMoonOrbit_(sats[i]);
        if (orb && orb.a_au > maxAu) maxAu = orb.a_au;
      }
      // Bodies without satellites: scale to show roughly geosync/escape range.
      // Use 0.001 AU (~150,000 km) as a default extent so stations are visible.
      var scalePxPerAU = (maxAu > 0)
        ? (ORBITAL_FIT_RADIUS_PX / maxAu)
        : (ORBITAL_FIT_RADIUS_PX / 0.001);

      // Place satellites
      for (var i = 0; i < sats.length; i++) {
        var m   = sats[i];
        var mid = String(m.body_id || '').trim();
        var orb = _bodyMoonOrbit_(m);
        var ent = {
          kind:      'moon',
          id:        mid,
          name:      m.body_name,
          x: 0, y: 0,
          moonOrbit: orb,
          parentId:  centerId,
          raw:       m
        };
        if (!orb) {
          // Fallback: stylized concentric placement when we lack orbital data
          var ang = (2 * Math.PI * i) / Math.max(sats.length, 1);
          var R   = ORBITAL_FIT_RADIUS_PX * (i + 1) / Math.max(sats.length, 1);
          ent.x = R * Math.cos(ang);
          ent.y = R * Math.sin(ang);
        }
        entities.push(ent);
        byId[m.body_id] = ent;
      }

      // Pirate / L-point jump points associated with this body. Place each
      // outside the outer satellite at a fixed angular offset so they read
      // as Lagrange-adjacent without trying to be physically exact.
      var jpAngStep = Math.PI * 0.6;
      var jpBaseR   = (maxAu > 0 ? maxAu : 0.001) * scalePxPerAU + 60;
      var jpIdx = 0;
      for (var i = 0; i < systemViewData.jumpPoints.length; i++) {
        var jp = systemViewData.jumpPoints[i];
        if (!jp) continue;
        if (jp.jump_point_type !== 'pirate_point') continue;
        if (String(jp.associated_body_id) !== centerIdStr) continue;
        var ang = jpIdx * jpAngStep + 0.4;
        var ent = {
          kind: 'jump_point',
          id:   jp.jump_point_id,
          name: jp.jump_point_name,
          x:    jpBaseR * Math.cos(ang),
          y:    jpBaseR * Math.sin(ang),
          raw:  jp
        };
        entities.push(ent);
        byId[jp.jump_point_id] = ent;
        jpIdx++;
      }

      // Orbital infrastructure attached to this body. Surface facilities
      // (location_type='surface') belong to a future planetary view and are
      // skipped here. Off-surface stations cluster just outside the body.
      var infraR = Math.max(ORBITAL_BODY_MIN_PX * 4, scalePxPerAU * 0.0003);
      var infraIdx = 0;
      for (var i = 0; i < systemViewData.infrastructure.length; i++) {
        var f = systemViewData.infrastructure[i];
        if (!f) continue;
        if (String(f.orbiting_body_id) !== centerIdStr) continue;
        if (String(f.location_type || '').toLowerCase() === 'surface') continue;
        var ang = infraIdx * 0.9 + 0.3;
        var ent = {
          kind: 'infrastructure',
          id:   f.facility_id,
          name: f.facility_name,
          x:    infraR * Math.cos(ang),
          y:    infraR * Math.sin(ang),
          raw:  f
        };
        entities.push(ent);
        byId[f.facility_id] = ent;
        infraIdx++;
      }

      return {
        entities:     entities,
        byId:         byId,
        center:       centerEnt,
        scalePxPerAU: scalePxPerAU,
        maxAu:        maxAu
      };
    }

    function applyOrbitalPositions_(layout) {
      if (!layout) return;
      var t   = daysSinceJ2000_();
      var DEG = Math.PI / 180;
      var sc  = layout.scalePxPerAU;
      for (var i = 0; i < layout.entities.length; i++) {
        var ent = layout.entities[i];
        var orb = ent.moonOrbit;
        if (!orb) continue;
        var L = (orb.L0 + 360 * (t / orb.period)) * DEG;
        var R = orb.a_au * sc;
        ent.x = R * Math.cos(L);
        ent.y = R * Math.sin(L);
      }
    }

    function bodyHasOrbitalContent_(bodyEntity) {
      if (!bodyEntity || !systemViewData) return false;
      var id = String(bodyEntity.id);
      // Has at least one moon
      for (var i = 0; i < systemViewData.bodies.length; i++) {
        var b = systemViewData.bodies[i];
        if (!b) continue;
        var bt = String(b.body_type || '').toLowerCase();
        if (bt !== 'moon') continue;
        if (String(b.orbit_parent_id) === id) return true;
      }
      // Or at least one piece of off-surface infrastructure attached here
      for (var i = 0; i < systemViewData.infrastructure.length; i++) {
        var f = systemViewData.infrastructure[i];
        if (!f) continue;
        if (String(f.orbiting_body_id) !== id) continue;
        if (String(f.location_type || '').toLowerCase() === 'surface') continue;
        return true;
      }
      // Or a pirate / L-point JP attached to it
      for (var i = 0; i < systemViewData.jumpPoints.length; i++) {
        var jp = systemViewData.jumpPoints[i];
        if (!jp) continue;
        if (jp.jump_point_type === 'pirate_point' &&
            String(jp.associated_body_id) === id) return true;
      }
      return false;
    }

    function enterOrbitalView(bodyEntity) {
      if (!bodyEntity) return;
      var layout = computeOrbitalLayout_(bodyEntity);
      if (!layout) return;
      var counts = { moons: 0, infra: 0, jp: 0 };
      for (var ci = 0; ci < layout.entities.length; ci++) {
        var ce = layout.entities[ci];
        if (ce === layout.center) continue;
        if (ce.kind === 'moon')           counts.moons++;
        else if (ce.kind === 'infrastructure') counts.infra++;
        else if (ce.kind === 'jump_point')     counts.jp++;
      }
      console.log('[orbital] entered', bodyEntity.name, 'id=', bodyEntity.id,
        'moons=', counts.moons, 'infra=', counts.infra, 'jp=', counts.jp,
        'scalePxPerAU=', layout.scalePxPerAU);
      systemViewState = { view: { x: view.x, y: view.y, scale: view.scale }, selectedEntity: selectedEntity };
      orbitalLayout = layout;
      currentView   = 'orbital';
      selectedEntity = null;
      hoveredEntity  = null;
      view = { x: 0, y: 0, scale: 1 };
      document.getElementById('viewTitle').textContent =
        bodyEntity.name + ' — Orbital View';
      document.getElementById('btn-back-system').style.display = '';
      document.getElementById('btn-back-galactic').style.display = 'none';
      document.getElementById('btn-terra').style.display = 'none';
      updatePanel();
      draw();
    }

    function exitOrbitalView() {
      if (currentView !== 'orbital') return;
      orbitalLayout = null;
      currentView   = 'system';
      selectedEntity = systemViewState ? systemViewState.selectedEntity : null;
      hoveredEntity  = null;
      if (systemViewState && systemViewState.view) {
        view = systemViewState.view;
      } else {
        view = { x: 0, y: 0, scale: 0.5 };
      }
      systemViewState = null;
      document.getElementById('viewTitle').textContent =
        (systemViewData && systemViewData.system
          ? (systemViewData.system.system_name + ' — System View')
          : 'System View');
      document.getElementById('btn-back-system').style.display = 'none';
      document.getElementById('btn-back-galactic').style.display = '';
      document.getElementById('btn-terra').style.display = 'none';
      updatePanel();
      draw();
    }

    function findOrbitalEntityAt(sx, sy) {
      if (!orbitalLayout) return null;
      var w     = screenToWorld(sx, sy);
      var hitR  = Math.max(8, 14 / view.scale);
      var best = null;
      var bestDist = Infinity;
      for (var i = 0; i < orbitalLayout.entities.length; i++) {
        var e  = orbitalLayout.entities[i];
        var dx = e.x - w.x, dy = e.y - w.y;
        var d  = Math.sqrt(dx*dx + dy*dy);
        if (d < hitR && d < bestDist) { best = e; bestDist = d; }
      }
      return best;
    }

    function drawOrbitalView_() {
      if (!ctx || !orbitalLayout) return;
      applyOrbitalPositions_(orbitalLayout);

      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(0, 0, width, height);

      var center = worldToScreen(0, 0);

      // Satellite orbit guides — concentric rings at each moon's a_au
      ctx.strokeStyle = '#1a1a2e';
      ctx.lineWidth   = 1;
      for (var i = 0; i < orbitalLayout.entities.length; i++) {
        var e = orbitalLayout.entities[i];
        if (!e.moonOrbit) continue;
        var R = e.moonOrbit.a_au * orbitalLayout.scalePxPerAU;
        ctx.beginPath();
        ctx.arc(center.x, center.y, R * view.scale, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Central body — drawn at realistic radius (km / km-per-px) with a floor
      var centerEnt = orbitalLayout.center;
      var radiusKm  = _bodyRadiusKm_(centerEnt.raw) || _bodyRadiusKm_(centerEnt.id) || 6000;
      var bodyAu       = (radiusKm > 0 ? radiusKm : 6000) / KM_PER_AU;
      var bodyWorldR   = bodyAu * orbitalLayout.scalePxPerAU;
      var bodyScreenR  = Math.max(ORBITAL_BODY_MIN_PX, bodyWorldR * view.scale);
      ctx.fillStyle = '#9ac';
      ctx.beginPath();
      ctx.arc(center.x, center.y, bodyScreenR, 0, Math.PI * 2);
      ctx.fill();

      // Body label
      ctx.fillStyle = '#fff';
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(centerEnt.name, center.x, center.y - bodyScreenR - 6);

      // Other entities (moons, infrastructure, jump points)
      for (var i = 0; i < orbitalLayout.entities.length; i++) {
        var e = orbitalLayout.entities[i];
        if (e.id === centerEnt.id) continue;
        var p = worldToScreen(e.x, e.y);
        if (p.x < -50 || p.x > width + 50 || p.y < -50 || p.y > height + 50) continue;
        var isSel = selectedEntity && selectedEntity.id === e.id;
        var isHov = hoveredEntity  && hoveredEntity.id  === e.id;
        drawEntity_(e, p, isSel, isHov);
      }

      // Player ship marker — visible from anywhere in the same system, with
      // a corner-overlay fallback that always tells the player where the
      // ship is (including cross-system).
      drawOrbitalShipMarker_();

      document.getElementById('zoom').textContent = Math.round(view.scale * 100) + '%';
    }

    // Draws a high-contrast reticle for the ship: outer white halo, inner
    // magenta ring, label below.
    function _drawShipReticle_(x, y, label, includeChevron, chevronAngle) {
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth   = 3.5;
      ctx.beginPath();
      ctx.arc(x, y, 11, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = '#f0a';
      ctx.lineWidth   = 2;
      ctx.beginPath();
      ctx.arc(x, y, 11, 0, Math.PI * 2);
      ctx.stroke();
      if (includeChevron) {
        ctx.fillStyle = '#f0a';
        var ah = 7;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(chevronAngle) * ah,
                   y + Math.sin(chevronAngle) * ah);
        ctx.lineTo(x + Math.cos(chevronAngle + 2.5) * ah,
                   y + Math.sin(chevronAngle + 2.5) * ah);
        ctx.lineTo(x + Math.cos(chevronAngle - 2.5) * ah,
                   y + Math.sin(chevronAngle - 2.5) * ah);
        ctx.closePath();
        ctx.fill();
      }
      if (label) {
        ctx.fillStyle = '#f0a';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(label, x, y + 24);
      }
    }

    function _drawOrbitalShipOverlay_(text) {
      var pad = 10;
      ctx.font = '11px monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,0,170,0.15)';
      ctx.fillRect(pad, pad, ctx.measureText(text).width + 16, 22);
      ctx.fillStyle = '#f0a';
      ctx.fillText(text, pad + 8, pad + 15);
    }

    function drawOrbitalShipMarker_() {
      if (!ship || !systemViewData || !orbitalLayout) return;
      var sameSystem = Number(ship.systemId) === Number(systemViewData.system.system_id);
      var locId    = ship.locationId;
      var targetId = (ship.transitState === 'TRANSITING') ? ship.transitTargetId : null;

      // Cross-system: just an overlay so the player isn't left guessing.
      if (!sameSystem) {
        _drawOrbitalShipOverlay_('SHIP: in another system (id ' + ship.systemId + ')');
        return;
      }

      var orbLoc    = locId    ? orbitalLayout.byId[locId]    : null;
      var orbTarget = targetId ? orbitalLayout.byId[targetId] : null;
      var sysLoc    = locId    && systemViewLayout && systemViewLayout.byId
                        ? systemViewLayout.byId[locId]    : null;
      var sysTarget = targetId && systemViewLayout && systemViewLayout.byId
                        ? systemViewLayout.byId[targetId] : null;
      var centerSys = systemViewLayout && systemViewLayout.byId
                        ? systemViewLayout.byId[orbitalLayout.center.id] : null;

      // In-frame transit: both endpoints in this orbital frame → full
      // dashed path + interpolated marker (matches system view convention).
      if (orbLoc && orbTarget) {
        var p1 = worldToScreen(orbLoc.x, orbLoc.y);
        var p2 = worldToScreen(orbTarget.x, orbTarget.y);
        ctx.save();
        ctx.strokeStyle = '#f0a';
        ctx.lineWidth = 1.5;
        if (ctx.setLineDash) ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
        if (ctx.setLineDash) ctx.setLineDash([]);
        ctx.restore();

        var totalH    = estimateTransitHoursClient_(locId, targetId);
        var totalT    = Math.max(1, Math.round(totalH * TICKS_PER_HOUR));
        var remaining = Math.max(0, Number(ship.transitEndTick) - simTick);
        var frac      = Math.max(0, Math.min(1, 1 - (remaining / totalT)));
        var ix = orbLoc.x + (orbTarget.x - orbLoc.x) * frac;
        var iy = orbLoc.y + (orbTarget.y - orbLoc.y) * frac;
        var ip = worldToScreen(ix, iy);
        var theta = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        _drawShipReticle_(ip.x, ip.y, 'YOU → ' + (orbTarget.name || targetId), true, theta);
        return;
      }

      // Static at an in-frame entity (the central body, satellite, etc.)
      if (orbLoc) {
        var p = worldToScreen(orbLoc.x, orbLoc.y);
        _drawShipReticle_(p.x, p.y, 'YOU', false, 0);
        _drawOrbitalShipOverlay_('SHIP: ' + (orbLoc.name || locId));
        return;
      }

      // Out of this frame but still in this system. Edge marker pointing
      // toward the actual location, plus a corner overlay.
      if (sysLoc && centerSys) {
        var dxs = sysLoc.x - centerSys.x;
        var dys = sysLoc.y - centerSys.y;
        var len = Math.sqrt(dxs*dxs + dys*dys);
        if (len > 0) {
          var nx = dxs / len, ny = dys / len;
          var margin = 60;
          var halfW  = width  / 2 - margin;
          var halfH  = height / 2 - margin;
          var t = Math.min(
            Math.abs(nx) > 1e-6 ? Math.abs(halfW / nx) : Infinity,
            Math.abs(ny) > 1e-6 ? Math.abs(halfH / ny) : Infinity
          );
          var ex = width  / 2 + t * nx;
          var ey = height / 2 - t * ny; // y-flip
          var theta = Math.atan2(-ny, nx);
          _drawShipReticle_(ex, ey, sysLoc.name || locId, true, theta);
        }
        var label = 'SHIP: ' + (sysLoc.name || locId);
        if (sysTarget) label += ' → ' + (sysTarget.name || targetId);
        _drawOrbitalShipOverlay_(label);
        return;
      }

      // Couldn't resolve location at all — at least say so.
      _drawOrbitalShipOverlay_('SHIP: ' + (locId || 'unknown location'));
    }

    function findEntityAt(sx, sy) {
      if (!systemViewLayout) return null;
      var w        = screenToWorld(sx, sy);
      var hitR     = Math.max(8, 14 / view.scale);
      var best     = null;
      var bestDist = Infinity;
      for (var i = 0; i < systemViewLayout.entities.length; i++) {
        var e  = systemViewLayout.entities[i];
        if (!isHeliocentricEntity_(e)) continue;
        var dx = e.x - w.x, dy = e.y - w.y;
        var d  = Math.sqrt(dx*dx + dy*dy);
        if (d < hitR && d < bestDist) { best = e; bestDist = d; }
      }
      return best;
    }

    // True if `e` belongs in the heliocentric system view. Moons and anything
    // attached to a planet (pirate jump points, orbital infrastructure) live
    // in that planet's orbital view instead.
    function isHeliocentricEntity_(e) {
      if (!e) return false;
      if (e.kind === 'moon') return false;
      if (e.parentRelative) return false;
      return true;
    }

    // Walk up parent chains until we reach a heliocentric entity. Used to
    // anchor the ship marker in system view when the ship is at a moon or
    // station that lives in an orbital frame.
    function heliocentricAncestor_(layout, ent) {
      if (!layout || !ent) return null;
      var safety = 8;
      while (ent && !isHeliocentricEntity_(ent) && safety-- > 0) {
        var pid = (ent.moonOrbit && ent.moonOrbit.parent) ||
                  ent.parentId ||
                  (ent.parentRelative && ent.parentRelative.parentId);
        if (!pid) return null;
        ent = layout.byId[pid];
      }
      return ent;
    }

    function drawSystemView_() {
      if (!ctx || !systemViewLayout) return;

      // Live orbital motion for systems with real elements (Sol).
      applyOrbits_(systemViewLayout);

      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(0, 0, width, height);

      var center = worldToScreen(0, 0);

      // Orbit guides
      ctx.strokeStyle = '#1a1a2e';
      ctx.lineWidth   = 1;
      if (systemViewLayout.hasOrbits) {
        // Per-planet orbit rings at real radii
        for (var i = 0; i < systemViewLayout.entities.length; i++) {
          var e = systemViewLayout.entities[i];
          if (!e.orbit) continue;
          ctx.beginPath();
          ctx.arc(center.x, center.y, e.ringRadius * view.scale, 0, Math.PI * 2);
          ctx.stroke();
        }
      } else {
