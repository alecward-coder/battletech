        var bandRadii = [SYS_BAND_R.inner, SYS_BAND_R.habitable, SYS_BAND_R.outer, SYS_BAND_R.deep_outer];
        for (var i = 0; i < bandRadii.length; i++) {
          ctx.beginPath();
          ctx.arc(center.x, center.y, bandRadii[i] * view.scale, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      // Outer system boundary (jump-point ring)
      ctx.strokeStyle = '#2a2a3e';
      ctx.beginPath();
      ctx.arc(center.x, center.y, SYS_JP_R * view.scale, 0, Math.PI * 2);
      ctx.stroke();

      // Routes (under entities) — endpoints looked up live so orbital motion
      // drags route lines along with their endpoints. Routes that touch a
      // sub-orbital entity (moon, pirate point on a planet, station on a
      // planet) are hidden; they belong to that planet's orbital view.
      for (var i = 0; i < systemViewLayout.routes.length; i++) {
        var r  = systemViewLayout.routes[i];
        var o  = r.originId ? systemViewLayout.byId[r.originId] : null;
        var d  = r.destId   ? systemViewLayout.byId[r.destId]   : null;
        if (!isHeliocentricEntity_(o) || !isHeliocentricEntity_(d)) continue;
        var p1 = worldToScreen(o.x, o.y);
        var p2 = worldToScreen(d.x, d.y);
        var isPirate = r.raw && (r.raw.route_type === 'pirate_point_to_target');
        ctx.strokeStyle = isPirate ? 'rgba(255,80,80,0.25)' : 'rgba(120,120,200,0.18)';
        ctx.lineWidth   = 1;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      // Entities — heliocentric only. Sub-orbital things (moons, planet-
      // attached pirate JPs, planet-orbit infrastructure) appear in the
      // relevant planet's orbital view, not here.
      for (var i = 0; i < systemViewLayout.entities.length; i++) {
        var e = systemViewLayout.entities[i];
        if (!isHeliocentricEntity_(e)) continue;
        var p = worldToScreen(e.x, e.y);
        if (p.x < -50 || p.x > width + 50 || p.y < -50 || p.y > height + 50) continue;
        var isSel = selectedEntity && selectedEntity.id === e.id;
        var isHov = hoveredEntity && hoveredEntity.id === e.id;
        drawEntity_(e, p, isSel, isHov);
      }

      // [SYS-014 / SPEC-ORBITAL-INTERCEPT-001] Ship marker + transit
      // visualization. During transit the ship aims at a frozen intercept
      // point — where the destination body was predicted to be at ETA —
      // not at the body's live position. The faint reference line still
      // points at the body's current position so the player can see what
      // they targeted; the strong course line points at the intercept.
      if (ship && systemViewData &&
          Number(ship.systemId) === Number(systemViewData.system.system_id)) {
        var rawLoc    = ship.locationId    ? systemViewLayout.byId[ship.locationId]    : null;
        var rawTarget = (ship.transitState === 'TRANSITING' && ship.transitTargetId)
                          ? systemViewLayout.byId[ship.transitTargetId] : null;
        var locEnt    = heliocentricAncestor_(systemViewLayout, rawLoc);
        var targetEnt = heliocentricAncestor_(systemViewLayout, rawTarget);
        var hasIntercept = (ship.transitState === 'TRANSITING') && _hasIntercept_(ship);

        if (hasIntercept && targetEnt) {
          var ox = Number(ship.transitOriginX);
          var oy = Number(ship.transitOriginY);
          var ix = Number(ship.transitInterceptX);
          var iy = Number(ship.transitInterceptY);
          var frac = _transitProgress_(ship);
          var sx = ox + (ix - ox) * frac;
          var sy = oy + (iy - oy) * frac;

          var sp  = worldToScreen(sx, sy);
          var ipt = worldToScreen(ix, iy);
          var tpt = worldToScreen(targetEnt.x, targetEnt.y);

          // 1. Faint reference line: ship → destination body's current pos
          ctx.save();
          ctx.strokeStyle = 'rgba(255,0,170,0.25)';
          ctx.lineWidth = 1;
          if (ctx.setLineDash) ctx.setLineDash([2, 4]);
          ctx.beginPath();
          ctx.moveTo(sp.x, sp.y);
          ctx.lineTo(tpt.x, tpt.y);
          ctx.stroke();
          if (ctx.setLineDash) ctx.setLineDash([]);
          ctx.restore();

          // 2. Strong course line: ship → intercept point (remaining course)
          ctx.save();
          ctx.strokeStyle = '#f0a';
          ctx.lineWidth = 1.5;
          if (ctx.setLineDash) ctx.setLineDash([6, 4]);
          ctx.beginPath();
          ctx.moveTo(sp.x, sp.y);
          ctx.lineTo(ipt.x, ipt.y);
          ctx.stroke();
          if (ctx.setLineDash) ctx.setLineDash([]);
          ctx.restore();

          // 3. Ghost arrival marker at the intercept point
          ctx.save();
          ctx.strokeStyle = 'rgba(255,0,170,0.65)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(ipt.x, ipt.y, 8, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(ipt.x - 5, ipt.y); ctx.lineTo(ipt.x + 5, ipt.y);
          ctx.moveTo(ipt.x, ipt.y - 5); ctx.lineTo(ipt.x, ipt.y + 5);
          ctx.stroke();
          ctx.fillStyle = 'rgba(255,0,170,0.8)';
          ctx.font = '9px monospace';
          ctx.textAlign = 'center';
          ctx.fillText((targetEnt.name || 'target') + ' ETA',
            ipt.x, ipt.y - 12);
          ctx.restore();

          // 4. Ship marker at the interpolated position
          ctx.fillStyle = '#f0a';
          ctx.beginPath(); ctx.arc(sp.x, sp.y, 5, 0, Math.PI * 2); ctx.fill();
          ctx.font = '10px monospace';
          ctx.textAlign = 'left';
          var remTicks = Math.max(0, Number(ship.transitEndTick) - simTick);
          ctx.fillText('YOU → ' + (targetEnt.name || ship.transitTargetId) +
            '  ETA ' + formatTicks(remTicks),
            sp.x + 7, sp.y + 4);
        } else if (targetEnt && locEnt) {
          // Legacy direct-path fallback (transits started before the
          // intercept fields existed in the ship record).
          var p1 = worldToScreen(locEnt.x, locEnt.y);
          var p2 = worldToScreen(targetEnt.x, targetEnt.y);
          ctx.save();
          ctx.strokeStyle = '#f0a';
          ctx.lineWidth = 1.5;
          if (ctx.setLineDash) ctx.setLineDash([6, 4]);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
          if (ctx.setLineDash) ctx.setLineDash([]);
          ctx.restore();
          var totalH = estimateTransitHoursClient_(ship.locationId, ship.transitTargetId);
          var totalT = Math.max(1, Math.round(totalH * TICKS_PER_HOUR));
          var rem    = Math.max(0, Number(ship.transitEndTick) - simTick);
          var frac2  = Math.max(0, Math.min(1, 1 - (rem / totalT)));
          var lx = locEnt.x + (targetEnt.x - locEnt.x) * frac2;
          var ly = locEnt.y + (targetEnt.y - locEnt.y) * frac2;
          var lp = worldToScreen(lx, ly);
          ctx.fillStyle = '#f0a';
          ctx.beginPath(); ctx.arc(lp.x, lp.y, 5, 0, Math.PI * 2); ctx.fill();
          ctx.font = '10px monospace';
          ctx.textAlign = 'left';
          ctx.fillText('YOU →', lp.x + 7, lp.y + 4);
        } else if (locEnt) {
          // Idle: ship parked at the location
          var sp2 = worldToScreen(locEnt.x + 16, locEnt.y + 16);
          ctx.fillStyle = '#f0a';
          ctx.beginPath(); ctx.arc(sp2.x, sp2.y, 4, 0, Math.PI * 2); ctx.fill();
          ctx.font = '10px monospace';
          ctx.textAlign = 'left';
          ctx.fillText('YOU', sp2.x + 6, sp2.y + 4);
        }
      }

      document.getElementById('zoom').textContent = Math.round(view.scale * 100) + '%';
    }

    function drawEntity_(e, p, isSel, isHov) {
      var color, radius, shape;
      switch (e.kind) {
        case 'star':
          color = '#fc0'; radius = 12; shape = 'circle'; break;
        case 'planet':
          if (e.raw.is_inhabited === true || String(e.raw.is_inhabited).toUpperCase() === 'TRUE') color = '#0fa';
          else if (e.raw.habitability_class === 'gas_giant' || e.raw.habitability_class === 'ice_giant') color = '#a87';
          else color = '#789';
          radius = 6; shape = 'circle'; break;
        case 'asteroid_belt':
          color = '#666'; radius = 4; shape = 'circle'; break;
        case 'moon':
          color = '#888'; radius = 3; shape = 'circle'; break;
        case 'jump_point':
          color = (e.raw.is_pirate_point === true || String(e.raw.is_pirate_point).toUpperCase() === 'TRUE') ? '#f33' : '#0cf';
          radius = 6; shape = 'triangle'; break;
        case 'infrastructure':
          color = '#fa0'; radius = 5; shape = 'square'; break;
        default:
          color = '#ccc'; radius = 4; shape = 'circle';
      }

      ctx.fillStyle = color;
      var r = isSel ? radius * 1.4 : radius;
      if (shape === 'circle') {
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
      } else if (shape === 'triangle') {
        ctx.beginPath();
        ctx.moveTo(p.x,     p.y - r);
        ctx.lineTo(p.x - r, p.y + r * 0.8);
        ctx.lineTo(p.x + r, p.y + r * 0.8);
        ctx.closePath();
        ctx.fill();
      } else if (shape === 'square') {
        ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2);
      }

      if (isSel) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth   = 1.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius * 2.4, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Labels: star + planets + jump points always; others on hover/select
      var alwaysLabel = (e.kind === 'star' || e.kind === 'planet' || e.kind === 'jump_point');
      if (isSel || isHov || alwaysLabel) {
        ctx.fillStyle = isSel ? '#fff' : (isHov ? '#bbb' : '#888');
        ctx.font = '11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(e.name, p.x, p.y - radius - 6);
      }
    }

    function draw() {
      if (!ctx) return;
      if (transitionState) {
        drawTransitionFrame_();
        return;
      }
      if (currentView === 'orbital') {
        drawOrbitalView_();
        return;
      }
      if (currentView === 'system') {
        drawSystemView_();
        return;
      }
      drawGalacticView_();
    }

    function drawGalacticView_(skipSystemId) {
      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = '#1a1a2e';
      ctx.lineWidth = 1;
      var step = 100;
      var tl = screenToWorld(0, 0);
      var br = screenToWorld(width, height);
      for (var x = Math.floor(tl.x/step)*step; x <= Math.ceil(br.x/step)*step; x += step) {
        var p = worldToScreen(x, 0);
        ctx.beginPath(); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, height); ctx.stroke();
      }
      for (var y = Math.floor(br.y/step)*step; y <= Math.ceil(tl.y/step)*step; y += step) {
        var p = worldToScreen(0, y);
        ctx.beginPath(); ctx.moveTo(0, p.y); ctx.lineTo(width, p.y); ctx.stroke();
      }

      var terra = worldToScreen(0, 0);
      ctx.strokeStyle = '#333';
      ctx.beginPath();
      ctx.moveTo(terra.x - 15, terra.y); ctx.lineTo(terra.x + 15, terra.y);
      ctx.moveTo(terra.x, terra.y - 15); ctx.lineTo(terra.x, terra.y + 15);
      ctx.stroke();

      // [SYS-013] Jump-range ring around current ship location
      var currentSystem = getCurrentSystem();
      if (currentSystem) {
        var c = worldToScreen(currentSystem.x, currentSystem.y);
        ctx.strokeStyle = 'rgba(255, 0, 170, 0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(c.x, c.y, JUMP_RANGE_LY * view.scale, 0, Math.PI * 2);
        ctx.stroke();
      }

      var nr = galacticSystemRadiusPx_();
      for (var i = 0; i < systems.length; i++) {
        var s = systems[i];
        if (!isSystemRevealed(s, simYear)) continue;
        if (skipSystemId !== undefined && Number(s.id) === Number(skipSystemId)) continue;

        var p = worldToScreen(s.x, s.y);
        if (p.x < -10 || p.x > width+10 || p.y < -10 || p.y > height+10) continue;

        var isSel     = selected && selected.id === s.id;
        var isHov     = hovered  && hovered.id  === s.id;
        var isTerra   = s.id === 2371;
        var isCurrent = ship && Number(s.id) === Number(ship.systemId);

        ctx.beginPath();
        ctx.arc(p.x, p.y, isSel ? nr*1.5 : nr, 0, Math.PI*2);
        ctx.fillStyle = isTerra ? '#fc0' : isSel ? '#0fa' : isHov ? '#8cf' : '#556';
        ctx.fill();

        // [SYS-013] Current-location magenta ring (layered over base color)
        if (isCurrent) {
          ctx.strokeStyle = '#f0a';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, nr * 2.5, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (isSel) {
          ctx.strokeStyle = '#0fa';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, nr*2.5, 0, Math.PI*2);
          ctx.stroke();
        }

        if (isSel || isHov || isCurrent || nr >= 12) {
          ctx.fillStyle = isSel ? '#0fa' : isCurrent ? '#f0a' : '#aaa';
          ctx.font = '11px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(s.name, p.x, p.y - nr - 5);
        }
      }

      document.getElementById('zoom').textContent = Math.round(view.scale * 100) + '%';
    }

    var GALACTIC_DOT_COEFF        = 0.5;   // px per unit scale
    var GALACTIC_DOT_MAX_PX       = 8;     // hard cap so adjacent systems can't overlap
    var TRANSITION_TARGET_DOT_PX  = SYS_JP_R * 0.5; // 475 px = zenith ring at default sys scale
    function galacticSystemRadiusPx_() {
      // Galactic dots stay small (≤ 8 px) at all zooms so they never overlap
      // even where systems sit close together. The dot's grow-into-zenith-ring
      // animation runs during the transition fade, not as part of normal zoom.
      return Math.max(2, Math.min(GALACTIC_DOT_MAX_PX, view.scale * GALACTIC_DOT_COEFF));
    }

    function updatePanel() {
      // [SYS-014] In system or orbital view, render the selected entity.
      if (currentView === 'system' || currentView === 'orbital') {
        updateSystemEntityPanel_();
        return;
      }

      var actionsEl = document.getElementById('systemActions');
      if (!selected) {
        document.getElementById('systemName').textContent = '-';
        document.getElementById('systemInfo').innerHTML = '';
        actionsEl.innerHTML = '';
        return;
      }

      document.getElementById('systemName').textContent = selected.name;
      var distFromTerra = Math.sqrt(selected.x*selected.x + selected.y*selected.y).toFixed(1);

      // [SYS-013] Distance from current ship location
      var current = getCurrentSystem();
      var fromShipHtml = '';
      var pendingT = ship ? Number(ship.pendingJumpTargetId || 0) : 0;
      if (current && Number(current.id) !== Number(selected.id)) {
        var d = distanceLy(current, selected).toFixed(1);
        fromShipHtml = 'From Ship: '  + d  + ' LY<br>';
      } else if (current && Number(current.id) === Number(selected.id)) {
        fromShipHtml = '<span style="color:#f0a">You are here.</span><br>';
      }
      if (pendingT && pendingT === Number(selected.id)) {
        fromShipHtml += '<span style="color:#cf8">Pending jump target.</span><br>';
      }

      document.getElementById('systemInfo').innerHTML =
        'ID: '          + selected.id         + '<br>' +
        'X: '           + selected.x          + ' LY<br>' +
        'Y: '           + selected.y          + ' LY<br>' +
        'From Terra: '  + distFromTerra       + ' LY<br>' +
        fromShipHtml +
        'Revealed: '    + selected.revealYear;

      // [SYS-013] Action buttons — keyed off the K-F drive state machine.
      actionsEl.innerHTML = '';
      if (!ship || !current) {
        // Ship not loaded yet
        var setBtn0 = document.createElement('button');
        setBtn0.textContent = 'Set as starting position';
        setBtn0.onclick = setStartHere;
        actionsEl.appendChild(setBtn0);
        return;
      }

      var state    = getKfDriveState();
      var atSelf   = Number(current.id) === Number(selected.id);
      var distance = atSelf ? 0 : distanceLy(current, selected);
      var inRange  = distance <= JUMP_RANGE_LY;
      var isPendingTarget = pendingT && pendingT === Number(selected.id);

      // Helper to add a button
      function addBtn(label, cls, onClickFn, disabled) {
        var b = document.createElement('button');
        b.textContent = label;
        if (cls) b.className = cls;
        b.onclick = onClickFn;
        b.disabled = !!disabled;
        actionsEl.appendChild(b);
        return b;
      }

      if (state === 'READY' && !atSelf) {
        if (!inRange) {
          addBtn('Out of range (' + distance.toFixed(1) + ' LY)', 'btn-prep', null, true);
        } else if (ship.locationKind !== 'jump_point') {
          addBtn('Travel to a jump point first', 'btn-prep', null, true);
          addBtn('Emergency Jump',               'btn-emergency', emergencyJumpAction);
        } else {
          addBtn('Begin Jump Prep (' + distance.toFixed(1) + ' LY)', 'btn-prep', beginJumpPrep);
          addBtn('Emergency Jump',                                   'btn-emergency', emergencyJumpAction);
        }
      } else if (state === 'PREPPING') {
        if (isPendingTarget) {
          addBtn('Jump prep in progress — ' + formatTicks(prepRemaining()), 'btn-prep', null, true);
          addBtn('Abort Jump Prep',                                          'btn-abort', abortJumpPrepAction);
        } else if (!atSelf) {
          if (!inRange) {
            addBtn('Out of range (' + distance.toFixed(1) + ' LY)',          'btn-emergency', null, true);
          } else {
            addBtn('Emergency Jump (overrides prep)',                        'btn-emergency', emergencyJumpAction);
          }
        }
      } else if (state === 'READY_TO_JUMP') {
        if (isPendingTarget) {
          addBtn('Commit Jump',                                              'btn-commit', commitJumpAction);
          addBtn('Abort Jump Prep',                                          'btn-abort',  abortJumpPrepAction);
        } else if (!atSelf) {
          if (!inRange) {
            addBtn('Out of range (' + distance.toFixed(1) + ' LY)',          'btn-emergency', null, true);
          } else {
            addBtn('Emergency Jump (skips current prep)',                    'btn-emergency', emergencyJumpAction);
          }
        }
      } else if (state === 'RECHARGING' && !atSelf) {
        addBtn('Recharging — ' + formatTicks(rechargeRemaining()),           'btn-prep', null, true);
      }

      // [SYS-014] Drill into in-system view if data exists for this system.
      if (selected.hasSystemView) {
        var enterBtn = document.createElement('button');
        enterBtn.textContent = 'Enter system view';
        enterBtn.className   = 'btn-prep';
        enterBtn.onclick     = function() { enterSystemView(selected.id); };
        actionsEl.appendChild(enterBtn);
      }

      // Always offer the dev "set as starting position" option.
      var setBtn = document.createElement('button');
      setBtn.textContent = 'Set as starting position';
      setBtn.onclick = setStartHere;
      actionsEl.appendChild(setBtn);
    }

    // ─────────────────────────────────────────────
    // SYS-014 — Selected-entity panel (system view)
    // ─────────────────────────────────────────────
    function updateSystemEntityPanel_() {
      var nameEl    = document.getElementById('systemName');
      var infoEl    = document.getElementById('systemInfo');
      var actionsEl = document.getElementById('systemActions');
      actionsEl.innerHTML = '';

      var sysHeader = systemViewData && systemViewData.system
        ? systemViewData.system.system_name + ' system'
        : '(system)';

            ? 'Star: ' + (systemViewData.system.primary_star_name || '?') + '<br>' +

              'Bodies: '       + systemViewData.bodies.length         + '<br>' +
              'Jump points: '  + systemViewData.jumpPoints.length     + '<br>' +
              'Infrastructure: ' + systemViewData.infrastructure.length + '<br>' +
              'Routes: '       + systemViewData.routes.length
            : '(loading)');
        return;
      }

      var e = selectedEntity, raw = e.raw || {};
      nameEl.textContent = e.name + '  (' + e.kind.replace('_', ' ') + ')';

      var lines = [];
      function row(label, val) {

      // selected body has moons / infrastructure / pirate jump points.
      if (currentView === 'system' &&
          (e.kind === 'planet' || e.kind === 'moon') &&
          bodyHasOrbitalContent_(e)) {
        var btn = document.createElement('button');
        btn.textContent = 'View orbit';
        btn.onclick = (function(ent) {
          return function() { enterOrbitalView(ent); };
        })(e);
        actionsEl.appendChild(btn);
      }

      switch (e.kind) {
        case 'star':
          row('Type',          raw.body_type);
          row('Canonical',     raw.canonical_status);

        case 'asteroid_belt':
          row('Designation',   raw.scientific_name);
          row('Type',          raw.body_type);
          row('Orbit band',    raw.orbit_band);
          row('Inhabited',     raw.is_inhabited === true || String(raw.is_inhabited).toUpperCase() === 'TRUE' ? 'yes' : 'no');
          row('Population',    raw.population_level);
          row('Habitability',  raw.habitability_class);
          row('Atmosphere',    raw.atmosphere_type);
          row('Gravity',       raw.gravity_level);
          row('Water',         raw.water_presence);
          row('Industrial',    raw.industrial_value);
          row('Military',      raw.military_value);
          row('Owner',         raw.political_owner);
          row('Canonical',     raw.canonical_status);
          row('Source',        raw.source_note);
          row('Notes',         raw.notes);
          break;
        case 'moon':
          row('Designation',   raw.scientific_name);
          row('Parent',        raw.orbit_parent_id);
          row('Inhabited',     raw.is_inhabited === true || String(raw.is_inhabited).toUpperCase() === 'TRUE' ? 'yes' : 'no');

          row('Pirate',        raw.is_pirate_point === true || String(raw.is_pirate_point).toUpperCase() === 'TRUE' ? 'yes' : 'no');
          row('Known',         raw.is_known === true || String(raw.is_known).toUpperCase() === 'TRUE' ? 'yes' : 'no');
          row('Risk',          raw.risk_level);

          break;
        case 'infrastructure':
          row('Type',          raw.facility_type);
          row('Owner',         raw.owner);
          row('Operator',      raw.operator);
          row('Status',        raw.operational_status);
          row('Security',      raw.security_level);
          row('Traffic',       raw.traffic_level);
          row('Repair',        raw.repair_capacity);
          row('Dock',          raw.dock_capacity);
          row('Shipyard',      raw.shipyard_capacity);
          row('Military',      raw.military_presence);
          row('HPG-capable',   raw.hpg_capable === true || String(raw.hpg_capable).toUpperCase() === 'TRUE' ? 'yes' : 'no');
          row('Canonical',     raw.canonical_status);

    // ─────────────────────────────────────────────
    // SYS-014 — In-system travel (DropShip transit) actions
    // ─────────────────────────────────────────────
    function _addInSystemTravelButtons_(actionsEl, entity) {
      if (!ship) return;
      // Only meaningful when the player is in this system
      if (!systemViewData ||
          Number(ship.systemId) !== Number(systemViewData.system.system_id)) {
        return;
      }

      function addBtn(label, cls, onClickFn, disabled) {
        var b = document.createElement('button');
        b.textContent = label;
        if (cls) b.className = cls;
        if (onClickFn) b.onclick = onClickFn;
        b.disabled = !!disabled;
        actionsEl.appendChild(b);
      }

      var atSelf = String(entity.id) === String(ship.locationId);
      if (atSelf) {
        addBtn('You are here', 'btn-prep', null, true);
        return;
      }

      // Currently transiting?
      if (ship.transitState === 'TRANSITING') {
        if (String(entity.id) === String(ship.transitTargetId)) {
          var remaining = Math.max(0, Number(ship.transitEndTick) - simTick);
          addBtn('Arriving in ' + formatTicks(remaining), 'btn-prep', null, true);
        } else {
          addBtn('In transit — cannot depart again', 'btn-abort', null, true);
        }
        addBtn('Abort transit', 'btn-abort', abortInSystemTransit_);
        return;
      }

      // Jump prep active?
      var driveState = getKfDriveState();
      if (driveState === 'PREPPING' || driveState === 'READY_TO_JUMP') {
        addBtn('Jump prep active — cannot start transit', 'btn-abort', null, true);
        return;
      }

      // Free travel: any in-system location is reachable. Use the
      // canonical route time when one exists, otherwise estimate
      // from layout distance.
      var hours = estimateTransitHoursClient_(ship.locationId, entity.id);
      var ticks = Math.round(hours * TICKS_PER_HOUR);
      var route = _findClientRoute_(ship.locationId, entity.id);
      var label = 'Travel here · ' + formatTicks(ticks) + (route ? '' : ' (est.)');
      addBtn(label, 'btn-prep',
             function() { beginInSystemTransitAction_(entity.id, hours); });
    }

    // Hours estimate: route table > layout-distance heuristic > flat
    // 5-day fallback. Distance scale tuned so Terra ↔ Sol Zenith
    // (no direct route would still need ~7 days canonically) lands
    // close to the route value.
    function estimateTransitHoursClient_(originId, targetId) {
      var route = _findClientRoute_(originId, targetId);
      if (route) {
        var rh = Number(route.estimated_travel_time_hours) ||
                 (Number(route.estimated_travel_time_days || 0) * 24);
        if (rh > 0) return rh;
      }
      if (systemViewLayout && systemViewLayout.byId) {
        var a = systemViewLayout.byId[originId];
        var b = systemViewLayout.byId[targetId];
        if (a && b) {
          var dx = a.x - b.x, dy = a.y - b.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          // 0.25 hours per layout unit; floor 6 hours for short hops.
          return Math.max(6, Math.round(dist * 0.25));
        }
      }
      return 120;   // 5-day fallback
    }

    function _findClientRoute_(originId, destId) {
      if (!systemViewData || !systemViewData.routes) return null;
      var routes = systemViewData.routes;
      for (var i = 0; i < routes.length; i++) {
        var r = routes[i];
        var o = r.origin_location_id, d = r.destination_location_id;
        if ((o === originId && d === destId) ||
            (o === destId && d === originId)) {
          return r;
        }
      }
      return null;
    }

    function beginInSystemTransitAction_(targetLocationId, hoursOverride) {
      if (!ship) return;
      // [SPEC-ORBITAL-INTERCEPT-001] Compute the intercept payload before
      // hitting the server so the future destination position is frozen
      // at transit start using the same orbital math the renderer uses.
      var intercept = _computeIntercept_(ship.locationId, targetLocationId, hoursOverride || 0);
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.ok) {
            ship = result.ship;
            playCrewAnnouncement('DROPSHIP_DEPARTED');
            _lastTransitState  = 'TRANSITING';
            _lastTransitTarget = String(ship.transitTargetId || '');
            updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
          } else {
            alert(_describeFailure(result));
            updatePanel();
          }
        })
        .withFailureHandler(function(err) {
          alert('Transit error: ' + err.message);
          updatePanel();
        })
        .beginInSystemTransit(targetLocationId, simTick, hoursOverride || 0, intercept);
    }

    // ─── SPEC-ORBITAL-INTERCEPT-001 helpers ─────────────────────
    // Computes the destination body's position at currentSimTime + travel
    // time using its orbital elements; returns { originX, originY,
    // interceptX, interceptY } in system-view world coordinates. Returns
    // null when we lack the data — server falls back to legacy direct
    // path in that case.
    function _computeIntercept_(originId, targetId, hoursOverride) {
      if (!systemViewLayout || !systemViewLayout.byId) return null;
      var oEnt = systemViewLayout.byId[originId];
      if (!oEnt) return null;
      var hours = Number(hoursOverride) > 0
        ? Number(hoursOverride)
        : estimateTransitHoursClient_(originId, targetId);
      if (!isFinite(hours) || hours <= 0) hours = 120;
      var arrivalDays = daysSinceJ2000_() + (hours / 24);
      var pred = _predictBodyPosition_(targetId, arrivalDays);
      if (!pred) return null;
      return {
        originX:    oEnt.x,
        originY:    oEnt.y,
        interceptX: pred.x,
        interceptY: pred.y
      };
    }

    // Predicts an entity's system-view world position at a target J2000
    // day count, using its orbital elements (and recursively its parent's).
    // Falls back to the entity's current position when no orbit data is
    // available — that's correct for static bodies (jump points, deep-
    // space stations, the star).
    function _predictBodyPosition_(entId, atJ2000Days) {
      if (!systemViewLayout || !systemViewLayout.byId) return null;
      var ent = systemViewLayout.byId[entId];
      if (!ent) return null;
      var DEG = Math.PI / 180;
      // Planet around the star
      if (ent.orbit) {
        var L = (ent.orbit.L0 + 360 * (atJ2000Days / ent.orbit.period)) * DEG;
        var R = ent.orbit.a_au * SOL_AU_PX;
        return { x: R * Math.cos(L), y: R * Math.sin(L) };
      }
      // Moon around its parent
      if (ent.moonOrbit) {
        var parent = _predictBodyPosition_(ent.moonOrbit.parent, atJ2000Days);
        if (!parent) return null;
        var Lm = (ent.moonOrbit.L0 + 360 * (atJ2000Days / ent.moonOrbit.period)) * DEG;
        var Rm = ent.moonOrbit.a_au * SOL_AU_PX;
        return { x: parent.x + Rm * Math.cos(Lm), y: parent.y + Rm * Math.sin(Lm) };
      }
      // Parent-relative entity (pirate JPs, infrastructure tied to a body)
      if (ent.parentRelative) {
        var pp = _predictBodyPosition_(ent.parentRelative.parentId, atJ2000Days);
        if (!pp) return null;
        if (ent.parentRelative.mode === 'pirate') {
          var pAng    = Math.atan2(pp.y, pp.x);
          var pRadius = Math.sqrt(pp.x * pp.x + pp.y * pp.y);
          var rad = ent.parentRelative.radial;
          var a   = ent.parentRelative.angular;
          return { x: (pRadius + rad) * Math.cos(pAng + a),
                   y: (pRadius + rad) * Math.sin(pAng + a) };
        }
        if (ent.parentRelative.mode === 'cartesian') {
          return { x: pp.x + ent.parentRelative.ox, y: pp.y + ent.parentRelative.oy };
        }
      }
      // Static (star, system-level JPs, deep-space infra)
      return { x: ent.x, y: ent.y };
    }

    function _hasIntercept_(s) {
      if (!s) return false;
      if (Number(s.transitStartTick) <= 0) return false;
      // Treat all-zero as "no intercept stored" (legacy transits).
      if (Number(s.transitOriginX) === 0 && Number(s.transitOriginY) === 0 &&
          Number(s.transitInterceptX) === 0 && Number(s.transitInterceptY) === 0) {
        return false;
      }
      return true;
    }

    function _transitProgress_(s) {
      if (!s) return 0;
      var start = Number(s.transitStartTick) || 0;
      var end   = Number(s.transitEndTick)   || 0;
      if (end <= start) return 0;
      return Math.max(0, Math.min(1, (simTick - start) / (end - start)));
    }

    function abortInSystemTransit_() {
      if (!ship) return;
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.ok) {
            ship = result.ship;
            playCrewAnnouncement('DROPSHIP_ABORTED');
            _lastTransitState  = 'IDLE';
            _lastTransitTarget = '';
            updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
          } else {
            alert(_describeFailure(result));
          }
        })
        .withFailureHandler(function(err) {
          alert('Abort error: ' + err.message);
        })
        .abortInSystemTransit();
    }

    function getMousePos(e) {
      var rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function onMouseDown(e) {
      var pos = getMousePos(e);
      drag = { x: pos.x, y: pos.y, vx: view.x, vy: view.y };
    }

    function onMouseMove(e) {
      var pos = getMousePos(e);
      if (drag) {
        var dx = (pos.x - drag.x) / view.scale;
        var dy = (pos.y - drag.y) / view.scale;
        view.x = drag.vx + dx;
        view.y = drag.vy - dy;
        draw();
      } else if (currentView === 'orbital') {
        hoveredEntity = findOrbitalEntityAt(pos.x, pos.y);
        draw();
      } else if (currentView === 'system') {
        hoveredEntity = findEntityAt(pos.x, pos.y);
        draw();
      } else {
        hovered = findSystemAt(pos.x, pos.y);
        draw();
      }
    }

    function onMouseUp() { drag = null; }

    function onClick(e) {
      if (drag) return;
      var pos = getMousePos(e);
      if (currentView === 'orbital') {
        selectedEntity = findOrbitalEntityAt(pos.x, pos.y);
        updatePanel();
        draw();
        return;
      }
      if (currentView === 'system') {
        selectedEntity = findEntityAt(pos.x, pos.y);
        updatePanel();
        draw();
        return;
      }
      selected = findSystemAt(pos.x, pos.y);
      updatePanel();
      draw();
    }

    function onDblClick(e) {
      var pos = getMousePos(e);
      if (currentView === 'orbital') {
        var ent = findOrbitalEntityAt(pos.x, pos.y);
        if (ent) {
          view.x = -ent.x;
          view.y = -ent.y;
          selectedEntity = ent;
          updatePanel();
          draw();
        }
        return;
      }
      if (currentView === 'system') {
        // Double-click recenters camera on entity in system view.
        var ent = findEntityAt(pos.x, pos.y);
        if (ent) {
          view.x = -ent.x;
          view.y = -ent.y;
          selectedEntity = ent;
          updatePanel();
          draw();
        }
        return;
      }
      var s = findSystemAt(pos.x, pos.y);
      if (s) {
        view.x = -s.x;
        view.y = -s.y;
        selected = s;
        updatePanel();
        // Enter system view automatically if data exists.
        if (s.hasSystemView) {
          enterSystemView(s.id);
        } else {
          draw();
        }
      }
    }

    // Zoom momentum: each wheel tick adds an impulse to velocity (in
    // natural-log scale per frame). A RAF loop applies and decays it so
    // a heavy scroll keeps gliding after the wheel stops.
    var zoomVelocity = 0;
    var zoomRafId    = null;
    var ZOOM_IMPULSE = 0.08;
    var ZOOM_DECAY   = 0.88;
    var ZOOM_EPS     = 0.001;
    // Galactic view spans hundreds of light-years per pixel at default scale,
    // so dense regions need very deep zoom before the "only one revealed
    // system on canvas" auto-enter rule can be satisfied. System view is much
    // smaller-grained and 20× is plenty there.
    var ZOOM_MIN              = 0.05;
    var ZOOM_MAX_GALACTIC     = 500;
    var ZOOM_MAX_SYSTEM       = 20;
    var ZOOM_MAX_ORBITAL      = 50;
    function currentZoomMax_() {
      if (currentView === 'orbital') return ZOOM_MAX_ORBITAL;
      if (currentView === 'system')  return ZOOM_MAX_SYSTEM;
      return ZOOM_MAX_GALACTIC;
    }

    function onWheel(e) {
      e.preventDefault();
      if (isTransitioningViews) return;
      var normalized = Math.max(-1, Math.min(1, -e.deltaY / 100));
      zoomVelocity += normalized * ZOOM_IMPULSE;
      if (zoomRafId === null) {
        zoomRafId = requestAnimationFrame(applyZoomMomentum_);
      }
    }

    function applyZoomMomentum_() {
      zoomRafId = null;
      if (isTransitioningViews) { zoomVelocity = 0; return; }
      if (Math.abs(zoomVelocity) < ZOOM_EPS) {
        zoomVelocity = 0;
        draw();
        return;
      }

      var zMax = currentZoomMax_();
      view.scale *= Math.exp(zoomVelocity);
      view.scale = Math.max(ZOOM_MIN, Math.min(zMax, view.scale));

      // Kill any leftover velocity once we hit a clamp boundary.
      if (view.scale >= zMax     && zoomVelocity > 0) zoomVelocity = 0;
      if (view.scale <= ZOOM_MIN && zoomVelocity < 0) zoomVelocity = 0;

      zoomVelocity *= ZOOM_DECAY;

      if (tryAutoTransitionViews_()) {
        zoomVelocity = 0;
        return;
      }

      draw();
      zoomRafId = requestAnimationFrame(applyZoomMomentum_);
    }

    // Returns true if a view transition was triggered (caller should skip its own draw).
    function tryAutoTransitionViews_() {
      if (isTransitioningViews) return false;

      if (currentView === 'galactic' && view.scale > 2) {
        // Trigger when a single revealed system is on canvas. The dot's
        // grow-to-zenith animation runs during the fade, so the trigger
        // doesn't need to wait for any specific zoom level beyond a small
        // floor that prevents firing trivially at default zoom.
        var visible = [];
        for (var i = 0; i < systems.length; i++) {
          var s = systems[i];
          if (!isSystemRevealed(s, simYear)) continue;
          var p = worldToScreen(s.x, s.y);
          if (p.x >= 0 && p.x <= width && p.y >= 0 && p.y <= height) {
            visible.push(s);
            if (visible.length > 1) return false;
          }
        }
        if (visible.length !== 1) return false;
        var target = visible[0];
        if (!target.hasSystemView) return false;

        isTransitioningViews = true;
        beginGalacticToSystemTransition_(target);
        return true;
      }

      if (currentView === 'system' &&
          view.scale < SYSTEM_AUTO_EXIT_SCALE &&
          performance.now() >= exitLockUntil) {
        isTransitioningViews = true;
        exitSystemView({ autoZoom: true });
        return true;
      }

      return false;
    }

    // Loads system-view data for `target`, then runs a cross-fade. The dot
    // animates from its small galactic size up to TRANSITION_TARGET_DOT_PX
    // (the zenith-ring radius at default sys scale 0.5), so by the end of the
    // fade the dot diameter and zenith diameter coincide exactly at galPos.
    function beginGalacticToSystemTransition_(target) {
      var galView = { x: view.x, y: view.y, scale: view.scale };
      var galPos  = worldToScreen(target.x, target.y);
      var galDotInitialPx = galacticSystemRadiusPx_();
      var savedVelocity = zoomVelocity;
      zoomVelocity = 0;

      // System view enters at default 0.5× scale, anchored so world (0,0)
      // (the system's star) renders at galPos. Zenith ring (SYS_JP_R * 0.5
      // = 475 px) ends up at the same pixel position the growing dot lands.
      var sysScale = 0.5;
      var sysViewParams = {
        x: (galPos.x - width / 2) / sysScale,
        y: (height / 2 - galPos.y) / sysScale,
        scale: sysScale
      };

      galacticState = {
        view:     galView,
        selected: selected,
        hovered:  hovered
      };

      google.script.run
        .withSuccessHandler(function(bundle) {
          if (!bundle || !bundle.system) {
            alert('Failed to load system data for ' + target.name + '.');
            galacticState = null;
            isTransitioningViews = false;
            return;
          }
          transitionState = {
            phase:        'galactic-to-system',
            target:       target,
            startTime:    performance.now(),
            durationMs:   TRANSITION_FADE_MS,
            galView:      galView,
            galPos:       galPos,
            galDotInitialPx: galDotInitialPx,
            sysView:      sysViewParams,
            sysViewData:  bundle,
            sysViewLayout: computeSystemLayout_(bundle),
            savedVelocity: savedVelocity
          };
          if (transitionRafId === null) {
            transitionRafId = requestAnimationFrame(drawTransitionFrame_);
          }
        })
        .withFailureHandler(function(err) {
          alert('System view error: ' + (err && err.message ? err.message : err));
          galacticState = null;
          isTransitioningViews = false;
        })
        .getStarSystemView(target.id);
    }

    function drawTransitionFrame_() {
      transitionRafId = null;
      var t = transitionState;
      if (!t) return;

      var now = performance.now();
      var raw = Math.min(1, Math.max(0, (now - t.startTime) / t.durationMs));
      // Smoothstep for an ease-in-ease-out feel.
      var k = raw * raw * (3 - 2 * raw);

      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(0, 0, width, height);

      var savedView           = view;
      var savedCurrentView    = currentView;
      var savedSysViewData    = systemViewData;
      var savedSysViewLayout  = systemViewLayout;

      // 1. Galactic backdrop — fade out. Skip the target system; we redraw
      // it ourselves below so it can grow continuously into the zenith ring.
      view           = t.galView;
      currentView    = 'galactic';
      systemViewData   = null;
      systemViewLayout = null;
      ctx.globalAlpha = 1 - k;
      drawGalacticView_(t.target.id);

      // 2. The target dot — animates from its galactic pixel size up to the
      // zenith-ring radius (475 px), anchored at galPos. By raw=1 the dot
      // coincides with the system view's zenith ring exactly.
      ctx.globalAlpha = 1;
      var dotR = t.galDotInitialPx + (TRANSITION_TARGET_DOT_PX - t.galDotInitialPx) * k;
      ctx.beginPath();
      ctx.arc(t.galPos.x, t.galPos.y, dotR, 0, Math.PI * 2);
      ctx.fillStyle = '#556';
      ctx.fill();

      // 3. System view — fade in over the dot. The zenith ring sits at
      // exactly the same pixel radius the dot just grew to.
      view             = t.sysView;
      currentView      = 'system';
      systemViewData   = t.sysViewData;
      systemViewLayout = t.sysViewLayout;
      ctx.globalAlpha = k;
      drawSystemView_();

      ctx.globalAlpha   = 1;
      view              = savedView;
      currentView       = savedCurrentView;
      systemViewData    = savedSysViewData;
      systemViewLayout  = savedSysViewLayout;

      if (raw >= 1) {
        finishGalacticToSystemTransition_();
        return;
      }
      transitionRafId = requestAnimationFrame(drawTransitionFrame_);
    }

    function finishGalacticToSystemTransition_() {
      var t = transitionState;
      transitionState = null;
      if (!t) return;
      systemViewData   = t.sysViewData;
      systemViewLayout = t.sysViewLayout;
      currentView      = 'system';
      selectedEntity   = null;
      hoveredEntity    = null;
      view = { x: t.sysView.x, y: t.sysView.y, scale: t.sysView.scale };

      document.getElementById('viewTitle').textContent =
        (t.sysViewData.system.system_name || t.target.name) + ' — System View';
      document.getElementById('btn-back-galactic').style.display = '';
      document.getElementById('btn-terra').style.display = 'none';

      isTransitioningViews = false;
      exitLockUntil = performance.now() + POST_ENTER_EXIT_LOCK_MS;
      zoomVelocity = t.savedVelocity || 0;

      updatePanel();
      draw();

      if (Math.abs(zoomVelocity) > ZOOM_EPS && zoomRafId === null) {
        zoomRafId = requestAnimationFrame(applyZoomMomentum_);
      }
    }

    function centerTerra() {
      view.x = 0;
      view.y = 0;
      selected = systems.find(function(s) { return s.id === 2371; });
      updatePanel();
      draw();
    }

    // ─────────────────────────────────────────────
    // SYS-012 HALDEN
    // ─────────────────────────────────────────────
    function talkToHalden() {
      var input = document.getElementById('halden-input');
      var responseDiv = document.getElementById('halden-response');
      var text = input.value.trim();
      if (!text) return;
      responseDiv.textContent = '...';
      input.value = '';
      google.script.run
        .withSuccessHandler(function(response) {
          responseDiv.textContent = response;
        })
        .withFailureHandler(function(err) {
          responseDiv.textContent = 'ERROR: ' + err.message;
        })
        .talkToCharacter('char_001', 'player', text);
    }
  </script>
</body>
</html>
