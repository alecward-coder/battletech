<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a12; color: #ccc; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
    #container { display: flex; flex: 1; }
    #canvasWrap { flex: 1; position: relative; }
    #canvas { display: block; cursor: crosshair; }
    #panel { width: 200px; background: #12121a; border-left: 1px solid #333; padding: 12px; overflow-y: auto; }
    #panel h2 { font-size: 11px; color: #666; margin-bottom: 8px; }
    #shipCurrent { color: #f0a; font-size: 14px; font-weight: bold; }
    #shipDrive { font-size: 11px; color: #888; margin-top: 4px; line-height: 1.6; }
    #systemName { color: #0fa; font-size: 16px; font-weight: bold; }
    #systemInfo { font-size: 12px; color: #888; margin-top: 6px; line-height: 1.6; }
    #systemActions { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    #systemActions button { font-size: 11px; padding: 4px 8px; }
    #systemActions button:disabled { opacity: 0.35; cursor: not-allowed; }
    #controls { margin-top: 20px; padding-top: 12px; border-top: 1px solid #333; font-size: 11px; color: #555; line-height: 1.8; }
    #header { background: #12121a; padding: 8px 12px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    #header h1 { font-size: 14px; color: #0fa; }
    #header span { font-size: 11px; color: #555; }
    #simClock { font-size: 12px; color: #8cf; letter-spacing: 0.05em; }
    #simClockLabel { font-size: 10px; color: #445; margin-right: 6px; }
    #systemCount { font-size: 10px; color: #556; margin-left: 12px; }
    button { background: #222; border: 1px solid #444; color: #aaa; padding: 4px 10px; cursor: pointer; font-family: monospace; }
    button:hover { background: #333; }

    /* SYS-013 wait bar */
    #waitBar { background: #0f0f17; padding: 6px 12px; border-bottom: 1px solid #2a2a36; display: flex; align-items: center; gap: 6px; font-family: monospace; }
    #waitBar button { font-size: 11px; padding: 3px 8px; }
    .waitBar-label { font-size: 11px; color: #555; margin-right: 4px; }
    .waitBar-next { color: #8cf !important; border-color: #8cf !important; }
    .waitBar-next:hover { background: #8cf !important; color: #000 !important; }
    .waitBar-status { font-size: 10px; color: #556; margin-left: 12px; flex: 1; }

    /* SYS-013 ship prep status */
    #shipPrep { font-size: 11px; color: #cf8; margin-top: 4px; line-height: 1.5; }

    /* SYS-013 crew announcements */
    #announcementLog { font-size: 10px; color: #888; line-height: 1.5; max-height: 160px; overflow-y: auto; padding-right: 4px; }
    #announcementLog .ann-row { padding: 2px 0; border-bottom: 1px solid #1f1f28; }
    #announcementLog .ann-row:last-child { border-bottom: none; }
    #announcementLog .ann-time { color: #445; margin-right: 4px; }
    #announcementLog .ann-text { color: #aaa; }
    #announcementLog .ann-emergency .ann-text { color: #f96; }
    #announcementLog .ann-empty { color: #333; font-style: italic; }

    /* SYS-013 jump action button styles */
    #systemActions .btn-prep { color: #0fa; border-color: #0fa; }
    #systemActions .btn-prep:hover:enabled { background: #0fa; color: #000; }
    #systemActions .btn-commit { color: #cf8; border-color: #cf8; }
    #systemActions .btn-commit:hover:enabled { background: #cf8; color: #000; }
    #systemActions .btn-emergency { color: #f96; border-color: #f96; }
    #systemActions .btn-emergency:hover:enabled { background: #f96; color: #000; }
    #systemActions .btn-abort { color: #f66; border-color: #f66; }
    #systemActions .btn-abort:hover:enabled { background: #f66; color: #000; }

    /* Music button */
    #musicBtn {
      position: fixed; bottom: 16px; right: 16px;
      background: rgba(10,10,18,0.85); color: #556;
      border: 1px solid #333; border-radius: 4px;
      padding: 5px 10px; cursor: pointer;
      font-family: monospace; font-size: 12px;
      z-index: 9999; transition: color 0.2s, border-color 0.2s;
    }
    #musicBtn:hover { color: #0fa; border-color: #0fa; }
    #musicBtn.playing { color: #8cf; border-color: #8cf; }

    /* Halden panel */
    #halden-panel {
      position: fixed; bottom: 52px; right: 16px;
      width: 340px;
      background: rgba(10,10,18,0.92);
      border: 1px solid rgba(0,255,255,0.15);
      border-radius: 4px;
      padding: 12px;
      font-family: monospace; font-size: 13px; color: #ccc;
      z-index: 9998;
    }
    #halden-label {
      color: #0ff; font-size: 11px; margin-bottom: 8px; opacity: 0.7;
    }
    #halden-response {
      min-height: 60px; max-height: 180px;
      overflow-y: auto;
      margin-bottom: 8px;
      color: #eee; line-height: 1.6; font-size: 12px;
    }
    #halden-input {
      width: 100%; background: #111;
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 2px;
      color: #fff; padding: 6px;
      font-family: monospace; font-size: 12px;
      box-sizing: border-box;
      outline: none;
    }
    #halden-input:focus { border-color: rgba(0,255,255,0.5); }
    #halden-input::placeholder { color: #444; }
  </style>
</head>
<body>
  <div id="header">
    <h1>Phase 0 Starmap</h1>
    <div>
      <span id="simClockLabel">TC/TST</span>
      <span id="simClock">--</span>
      <span id="systemCount"></span>
    </div>
    <div>
      <button onclick="centerTerra()">Terra</button>
      <span id="zoom">100%</span>
    </div>
  </div>
  <div id="waitBar">
    <span class="waitBar-label">Wait:</span>
    <button onclick="advanceTime(30 * 60)">30m</button>
    <button onclick="advanceTime(1 * 3600)">1h</button>
    <button onclick="advanceTime(6 * 3600)">6h</button>
    <button onclick="advanceTime(1 * 86400)">1d</button>
    <button onclick="waitUntilNextEvent()" class="waitBar-next">⏭ Next event</button>
    <span id="nextEventLabel" class="waitBar-status"></span>
  </div>
  <div id="container">
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
    </div>
    <div id="panel">
      <h2>SHIP STATUS</h2>
      <div id="shipCurrent">-</div>
      <div id="shipDrive">-</div>
      <div id="shipPrep"></div>

      <h2 style="margin-top: 16px">SELECTED SYSTEM</h2>
      <div id="systemName">-</div>
      <div id="systemInfo"></div>
      <div id="systemActions"></div>

      <h2 style="margin-top: 16px">CREW ANNOUNCEMENTS</h2>
      <div id="announcementLog"></div>

      <div id="controls">
        Pan: drag<br>
        Zoom: wheel<br>
        Select: click<br>
        Center: dbl-click
      </div>
    </div>
  </div>

  <!-- Background Music -->
  <audio id="bgMusic" loop>
    <source src="https://raw.githubusercontent.com/alecward-coder/battletech/main/Reactor%20Core%20Continuum.mp3" type="audio/mpeg">
  </audio>
  <button id="musicBtn" onclick="toggleMusic()">♪ music off</button>

  <!-- SYS-012 Halden panel -->
  <div id="halden-panel">
    <div id="halden-label">// COMSTAR CHANNEL — PRECENTOR HALDEN</div>
    <div id="halden-response"></div>
    <input id="halden-input" type="text" placeholder="Speak to Halden..."
      onkeydown="if(event.key==='Enter') talkToHalden()">
  </div>

  <script>
    // ─────────────────────────────────────────────
    // MUSIC
    // ─────────────────────────────────────────────
    var bgMusic = document.getElementById('bgMusic');
    var musicBtn = document.getElementById('musicBtn');
    var musicPlaying = false;

    function toggleMusic() {
      if (musicPlaying) {
        bgMusic.pause();
        musicBtn.textContent = '♪ music off';
        musicBtn.classList.remove('playing');
        musicPlaying = false;
      } else {
        bgMusic.play();
        musicBtn.textContent = '♪ music on';
        musicBtn.classList.add('playing');
        musicPlaying = true;
      }
    }

    // ─────────────────────────────────────────────
    // TIME CONSTANTS
    // ─────────────────────────────────────────────
    var TICKS_PER_SECOND = 1;
    var TICKS_PER_MINUTE = 60;
    var TICKS_PER_HOUR   = 3600;
    var TICKS_PER_DAY    = 86400;

    var FTL_EPOCH_MS = Date.UTC(2108, 11, 1, 0, 0, 0);
    var DEFAULT_START_TICK = Math.floor((Date.UTC(2082, 0, 1) - FTL_EPOCH_MS) / 1000);

    // ─────────────────────────────────────────────
    // CLOCK STATE
    // ─────────────────────────────────────────────
    var simTick = DEFAULT_START_TICK;
    var simYear = 2082;
    var sessionRealStart = Date.now();
    var sessionTickStart = DEFAULT_START_TICK;
    var clockInterval = null;

    // ─────────────────────────────────────────────
    // TC/TST FORMATTER
    // ─────────────────────────────────────────────
    var TC_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun',
                     'Jul','Aug','Sep','Oct','Nov','Dec'];

    function ticksToTC(ticks) {
      var ms = FTL_EPOCH_MS + (ticks * 1000);
      var d  = new Date(ms);
      var day  = d.getUTCDate();
      var mon  = TC_MONTHS[d.getUTCMonth()];
      var year = d.getUTCFullYear();
      var hh   = pad(d.getUTCHours());
      var mm   = pad(d.getUTCMinutes());
      var ss   = pad(d.getUTCSeconds());
      return day + ' ' + mon + ' ' + year + ' / ' + hh + ':' + mm + ':' + ss + ' TST';
    }

    function ticksToYear(ticks) {
      var ms = FTL_EPOCH_MS + (ticks * 1000);
      var d  = new Date(ms);
      return d.getUTCFullYear();
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    // ─────────────────────────────────────────────
    // REVEAL YEAR PARSING
    // ─────────────────────────────────────────────
    function parseRevealYear(revealYear) {
      if (!revealYear || revealYear === '') return 9999;
      var match = String(revealYear).match(/^(\d+)/);
      return match ? parseInt(match[1], 10) : 9999;
    }

    function isSystemRevealed(system, currentYear) {
      var revealNum = parseRevealYear(system.revealYear);
      return currentYear >= revealNum;
    }

    // ─────────────────────────────────────────────
    // CLOCK LOOP
    // ─────────────────────────────────────────────
    function tickClock() {
      var elapsedSeconds = Math.floor((Date.now() - sessionRealStart) / 1000);
      simTick = sessionTickStart + elapsedSeconds + advanceOffsetTicks;
      simYear = ticksToYear(simTick);
      document.getElementById('simClock').textContent = ticksToTC(simTick);
      updateSystemCount();
      // [SYS-013] Drive state machine + tick-driven announcements.
      if (ship) {
        processDueEvents();
        updateShipStatus();
        if (selected) updatePanel();
        updateNextEventLabel();
      }
    }

    function startClock() {
      tickClock();
      clockInterval = setInterval(tickClock, 1000);
    }

    // ─────────────────────────────────────────────
    // SAVE / LOAD
    // ─────────────────────────────────────────────
    function initClock() {
      google.script.run
        .withSuccessHandler(function(savedTick) {
          sessionTickStart = (savedTick !== null) ? savedTick : DEFAULT_START_TICK;
          sessionRealStart = Date.now();
          startClock();
        })
        .withFailureHandler(function() {
          sessionTickStart = DEFAULT_START_TICK;
          sessionRealStart = Date.now();
          startClock();
        })
        .getSimTime();
    }

    function saveTime() {
      google.script.run.saveSimTime(simTick);
    }

    setInterval(saveTime, 60000);
    window.addEventListener('beforeunload', saveTime);

    // ─────────────────────────────────────────────
    // SYS-013 MOVEMENT — constants, ship state, state machine
    // ─────────────────────────────────────────────
    var JUMP_RANGE_LY   = 30;
    var RECHARGE_TICKS  = 7 * TICKS_PER_DAY;   // 604800 = 7 days
    var JUMP_PREP_TICKS = 2 * TICKS_PER_HOUR;  // 7200   = 2 hours
    var ship = null;

    // Time-advance offset accumulated by Wait buttons. Added on top
    // of the wall-clock-derived elapsed seconds in tickClock().
    var advanceOffsetTicks = 0;

    // State-machine bookkeeping for one-shot announcements.
    var _lastSeenState     = null;
    var _halfwayFired      = false;
    var _lastPendingTarget = 0;

    function loadShip() {
      google.script.run
        .withSuccessHandler(function(s) {
          ship = s;
          // First load: prime the state-machine flags but suppress
          // initial-state announcements.
          _lastSeenState     = getKfDriveState();
          _lastPendingTarget = Number(ship.pendingJumpTargetId || 0);
          _halfwayFired      = (_lastSeenState !== 'PREPPING') ? true : false;
          renderAnnouncementLog();   // shows "(no announcements yet)" until something fires
          updateShipStatus();
          updatePanel();
          updateNextEventLabel();
          draw();
        })
        .withFailureHandler(function(err) {
          document.getElementById('shipCurrent').textContent = 'ERROR';
          document.getElementById('shipDrive').textContent   = err.message || 'Could not load ship';
        })
        .getPlayerShip();
    }

    function getCurrentSystem() {
      if (!ship || !systems.length) return null;
      for (var i = 0; i < systems.length; i++) {
        if (Number(systems[i].id) === Number(ship.systemId)) return systems[i];
      }
      return null;
    }

    function getPendingTargetSystem() {
      if (!ship || !ship.pendingJumpTargetId) return null;
      for (var i = 0; i < systems.length; i++) {
        if (Number(systems[i].id) === Number(ship.pendingJumpTargetId)) return systems[i];
      }
      return null;
    }

    function distanceLy(a, b) {
      var dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function formatTicks(ticks) {
      var s = Math.max(0, Math.floor(ticks));
      var d = Math.floor(s / TICKS_PER_DAY);     s -= d * TICKS_PER_DAY;
      var h = Math.floor(s / TICKS_PER_HOUR);    s -= h * TICKS_PER_HOUR;
      var m = Math.floor(s / TICKS_PER_MINUTE);
      if (d > 0) return d + 'd ' + h + 'h';
      if (h > 0) return h + 'h ' + m + 'm';
      if (m > 0) return m + 'm';
      return '<1m';
    }

    function getKfDriveState() {
      if (!ship) return 'UNKNOWN';
      var isRecharging = simTick < (Number(ship.lastJumpTick) + RECHARGE_TICKS);
      var hasPrep      = !!ship.pendingJumpTargetId && Number(ship.pendingJumpTargetId) !== 0;
      if (hasPrep) {
        if (isRecharging) return 'RECHARGING';
        if (simTick < Number(ship.jumpPrepEndTime)) return 'PREPPING';
        return 'READY_TO_JUMP';
      }
      if (isRecharging) return 'RECHARGING';
      return 'READY';
    }

    function rechargeRemaining() {
      if (!ship) return 0;
      return Math.max(0, (Number(ship.lastJumpTick) + RECHARGE_TICKS) - simTick);
    }

    function prepRemaining() {
      if (!ship || !ship.pendingJumpTargetId) return 0;
      return Math.max(0, Number(ship.jumpPrepEndTime) - simTick);
    }

    // ─────────────────────────────────────────────
    // SYS-013 — Crew announcement system
    // ─────────────────────────────────────────────
    var ANNOUNCEMENT_TEXT = {
      JUMP_PREP_STARTED:        'All hands, prepare for jump. Secure stations and confirm readiness.',
      JUMP_PREP_HALFWAY:        'Jump preparation is underway. Navigation and engineering teams continue final checks.',
      JUMP_PREP_COMPLETE:       'Jump prep complete. Awaiting command authorization.',
      JUMP_COMMIT:              'Command authorization received. Initiating jump sequence.',
      JUMP_ARRIVAL:             'Jump complete. Confirming position and shipwide status.',
      EMERGENCY_JUMP_INITIATED: 'Emergency jump authorized. Brace for immediate transition.',
      DRIVE_RECHARGE_STARTED:   'K-F drive recharge cycle initiated.',
      DRIVE_RECHARGE_COMPLETE:  'K-F drive recharge complete. Jump capability restored.',
      JUMP_ABORTED:             'Jump preparation aborted. Returning to standard operations.'
    };
    var EMERGENCY_TYPES = { EMERGENCY_JUMP_INITIATED: true };

    var announcementLog = [];   // most-recent first; capped at 8

    function playCrewAnnouncement(eventType, payload) {
      var text = ANNOUNCEMENT_TEXT[eventType] || eventType;
      announcementLog.unshift({
        eventType: eventType,
        text:      text,
        tick:      simTick,
        payload:   payload || null
      });
      if (announcementLog.length > 8) announcementLog.length = 8;
      renderAnnouncementLog();
      console.log('[SYS-013]', eventType, text, payload || '');
    }

    function renderAnnouncementLog() {
      var el = document.getElementById('announcementLog');
      if (!el) return;
      if (!announcementLog.length) {
        el.innerHTML = '<div class="ann-empty">(no announcements yet)</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < announcementLog.length; i++) {
        var a = announcementLog[i];
        var time = formatHHMM(a.tick);
        var cls  = 'ann-row' + (EMERGENCY_TYPES[a.eventType] ? ' ann-emergency' : '');
        html += '<div class="' + cls + '">' +
                  '<span class="ann-time">' + time + '</span>' +
                  '<span class="ann-text">'  + escapeHtml(a.text) + '</span>' +
                '</div>';
      }
      el.innerHTML = html;
    }

    function formatHHMM(ticks) {
      var ms = FTL_EPOCH_MS + (ticks * 1000);
      var d = new Date(ms);
      return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }

    // ─────────────────────────────────────────────
    // SYS-013 — Tick-driven event processor
    // (called every simulation tick + after time advances)
    // ─────────────────────────────────────────────
    function processDueEvents() {
      if (!ship) return;

      // Reset halfway one-shot when the prep target changes
      var pending = Number(ship.pendingJumpTargetId || 0);
      if (pending !== _lastPendingTarget) {
        _halfwayFired      = (pending === 0);
        _lastPendingTarget = pending;
      }

      var newState = getKfDriveState();

      // Halfway one-shot during PREPPING
      if (newState === 'PREPPING' && !_halfwayFired) {
        var halfwayTick = Number(ship.jumpPrepEndTime) - (JUMP_PREP_TICKS / 2);
        if (simTick >= halfwayTick) {
          playCrewAnnouncement('JUMP_PREP_HALFWAY');
          _halfwayFired = true;
        }
      }

      // State-transition announcements (only the tick-driven ones —
      // action-driven transitions emit their own announcements
      // imperatively in the action handlers).
      if (newState !== _lastSeenState) {
        if (_lastSeenState === 'PREPPING' && newState === 'READY_TO_JUMP') {
          playCrewAnnouncement('JUMP_PREP_COMPLETE');
        }
        if (_lastSeenState === 'RECHARGING' && newState === 'READY') {
          playCrewAnnouncement('DRIVE_RECHARGE_COMPLETE');
        }
        _lastSeenState = newState;
      }
    }

    // ─────────────────────────────────────────────
    // SYS-013 — Time advance
    // ─────────────────────────────────────────────
    function advanceTime(ticks) {
      advanceOffsetTicks += Number(ticks);
      tickClock();         // recompute simTick + fire processDueEvents
      saveTime();          // persist immediately so reload picks up the advance
      updatePanel();
      updateNextEventLabel();
    }

    function getNextPendingEventTime() {
      if (!ship) return null;
      var candidates = [];
      var state = getKfDriveState();

      if (state === 'PREPPING') {
        var halfway = Number(ship.jumpPrepEndTime) - (JUMP_PREP_TICKS / 2);
        if (simTick < halfway && !_halfwayFired) candidates.push({ time: halfway, label: 'jump prep halfway' });
        if (simTick < Number(ship.jumpPrepEndTime)) {
          candidates.push({ time: Number(ship.jumpPrepEndTime), label: 'jump prep complete' });
        }
      }
      if (state === 'RECHARGING') {
        candidates.push({ time: Number(ship.lastJumpTick) + RECHARGE_TICKS, label: 'drive recharge complete' });
      }

      if (!candidates.length) return null;
      // Earliest event wins.
      candidates.sort(function(a, b) { return a.time - b.time; });
      return candidates[0];
    }

    function waitUntilNextEvent() {
      var next = getNextPendingEventTime();
      if (!next) {
        updateNextEventLabel('No pending timed actions.');
        return;
      }
      var delta = Math.max(0, next.time - simTick) + 1; // +1 to land just past the threshold
      advanceTime(delta);
    }

    function updateNextEventLabel(text) {
      var el = document.getElementById('nextEventLabel');
      if (!el) return;
      if (typeof text === 'string') { el.textContent = text; return; }
      var next = getNextPendingEventTime();
      if (!next) { el.textContent = ''; return; }
      el.textContent = 'Next: ' + next.label + ' in ' + formatTicks(next.time - simTick);
    }

    // ─────────────────────────────────────────────
    // SYS-013 — Ship-status panel
    // ─────────────────────────────────────────────
    function updateShipStatus() {
      if (!ship) return;
      var current = getCurrentSystem();
      document.getElementById('shipCurrent').textContent =
        'At: ' + (current ? current.name : '#' + ship.systemId);

      var driveEl = document.getElementById('shipDrive');
      var prepEl  = document.getElementById('shipPrep');
      var state   = getKfDriveState();

      switch (state) {
        case 'READY':
          driveEl.textContent = 'K-F drive: ready';
          driveEl.style.color = '#0fa';
          prepEl.textContent  = '';
          break;
        case 'PREPPING':
          var pendT = getPendingTargetSystem();
          driveEl.textContent = 'K-F drive: prepping';
          driveEl.style.color = '#cf8';
          prepEl.textContent  = 'Target: ' + (pendT ? pendT.name : '#' + ship.pendingJumpTargetId) +
                                ' · prep complete in ' + formatTicks(prepRemaining());
          break;
        case 'READY_TO_JUMP':
          var pT = getPendingTargetSystem();
          driveEl.textContent = 'K-F drive: ready to jump';
          driveEl.style.color = '#cf8';
          prepEl.textContent  = 'Target: ' + (pT ? pT.name : '#' + ship.pendingJumpTargetId) +
                                ' · awaiting command authorization';
          break;
        case 'RECHARGING':
          driveEl.textContent = 'K-F drive: recharging — ' + formatTicks(rechargeRemaining());
          driveEl.style.color = '#888';
          prepEl.textContent  = '';
          break;
        default:
          driveEl.textContent = 'K-F drive: ' + state.toLowerCase();
          driveEl.style.color = '#888';
          prepEl.textContent  = '';
      }
    }

    // ─────────────────────────────────────────────
    // SYS-013 — Action handlers
    // ─────────────────────────────────────────────
    function beginJumpPrep() {
      if (!selected || !ship) return;
      _setActionsBusy('Starting jump prep...');
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.ok) {
            ship = result.ship;
            playCrewAnnouncement('JUMP_PREP_STARTED');
            _lastSeenState = getKfDriveState();
            _halfwayFired  = false;
            updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
          } else {
            alert(_describeFailure(result));
            updatePanel();
          }
        })
        .withFailureHandler(function(err) {
          alert('Begin-prep error: ' + err.message);
          updatePanel();
        })
        .beginJumpPrep(selected.id, simTick);
    }

    function commitJumpAction() {
      if (!ship) return;
      _setActionsBusy('Committing jump...');
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.ok) {
            ship = result.ship;
            playCrewAnnouncement('JUMP_COMMIT');
            playCrewAnnouncement('JUMP_ARRIVAL');
            playCrewAnnouncement('DRIVE_RECHARGE_STARTED');
            _lastSeenState = getKfDriveState();
            updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
          } else {
            alert(_describeFailure(result));
            updatePanel();
          }
        })
        .withFailureHandler(function(err) {
          alert('Commit-jump error: ' + err.message);
          updatePanel();
        })
        .commitJump(simTick);
    }

    function emergencyJumpAction() {
      if (!selected || !ship) return;
      if (!confirm('Emergency jump bypasses prep and is logged as a risk event. Proceed?')) return;
      _setActionsBusy('Emergency jump...');
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.ok) {
            ship = result.ship;
            playCrewAnnouncement('EMERGENCY_JUMP_INITIATED', result.risk);
            playCrewAnnouncement('JUMP_ARRIVAL');
            playCrewAnnouncement('DRIVE_RECHARGE_STARTED');
            _lastSeenState = getKfDriveState();
            updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
          } else {
            alert(_describeFailure(result));
            updatePanel();
          }
        })
        .withFailureHandler(function(err) {
          alert('Emergency-jump error: ' + err.message);
          updatePanel();
        })
        .emergencyJump(selected.id, simTick);
    }

    function abortJumpPrepAction() {
      if (!ship) return;
      _setActionsBusy('Aborting prep...');
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.ok) {
            ship = result.ship;
            playCrewAnnouncement('JUMP_ABORTED');
            _lastSeenState = getKfDriveState();
            _halfwayFired  = true; // no halfway to fire after abort
            updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
          } else {
            alert(_describeFailure(result));
            updatePanel();
          }
        })
        .withFailureHandler(function(err) {
          alert('Abort error: ' + err.message);
          updatePanel();
        })
        .abortJumpPrep(simTick);
    }

    function setStartHere() {
      if (!selected) return;
      google.script.run
        .withSuccessHandler(function(s) {
          ship = s;
          _lastSeenState     = getKfDriveState();
          _halfwayFired      = true;
          _lastPendingTarget = 0;
          updateShipStatus(); updatePanel(); updateNextEventLabel(); draw();
        })
        .setPlayerLocation(selected.id);
    }

    function _describeFailure(result) {
      var msg = 'Action failed: ' + result.reason;
      if (result.reason === 'recharging') {
        msg += ' (' + formatTicks(result.ticksRemaining) + ' remaining)';
      } else if (result.reason === 'out_of_range') {
        msg += ' (' + result.distance.toFixed(1) + ' / ' + result.range + ' LY)';
      } else if (result.state) {
        msg += ' (current state: ' + result.state + ')';
      }
      return msg;
    }

    function _setActionsBusy(label) {
      var actionsEl = document.getElementById('systemActions');
      if (!actionsEl) return;
      var btns = actionsEl.querySelectorAll('button');
      for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
      // Don't change labels — just disable. Server response will repaint.
    }

    // ─────────────────────────────────────────────
    // STARMAP
    // ─────────────────────────────────────────────
    var systems = [];
    var view = { x: 0, y: 0, scale: 0.5 };
    var selected = null;
    var hovered = null;
    var drag = null;
    var canvas, ctx, width, height;

    google.script.run.withSuccessHandler(function(data) {
      systems = data;
      draw();
      updateSystemCount();
      loadShip();
    }).getSystems();

    function updateSystemCount() {
      var visible = systems.filter(function(s) { return isSystemRevealed(s, simYear); }).length;
      document.getElementById('systemCount').textContent = visible + ' / ' + systems.length + ' systems';
    }

    window.onload = function() {
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');
      resize();
      window.addEventListener('resize', resize);
      canvas.addEventListener('mousedown', onMouseDown);
      canvas.addEventListener('mousemove', onMouseMove);
      canvas.addEventListener('mouseup', onMouseUp);
      canvas.addEventListener('mouseleave', onMouseUp);
      canvas.addEventListener('click', onClick);
      canvas.addEventListener('dblclick', onDblClick);
      canvas.addEventListener('wheel', onWheel);
      initClock();
    };

    function resize() {
      var wrap = document.getElementById('canvasWrap');
      var rect = wrap.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width;
      canvas.height = height;
      draw();
    }

    function worldToScreen(wx, wy) {
      return {
        x: width/2 + (wx + view.x) * view.scale,
        y: height/2 - (wy + view.y) * view.scale
      };
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx - width/2) / view.scale - view.x,
        y: -((sy - height/2) / view.scale) - view.y
      };
    }

    function findSystemAt(sx, sy) {
      var w = screenToWorld(sx, sy);
      var r = 10 / view.scale;
      for (var i = 0; i < systems.length; i++) {
        var s = systems[i];
        if (!isSystemRevealed(s, simYear)) continue;
        var dx = s.x - w.x, dy = s.y - w.y;
        if (Math.sqrt(dx*dx + dy*dy) < r) return s;
      }
      return null;
    }

    function draw() {
      if (!ctx) return;
      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = '#1a1a2e';
      ctx.lineWidth = 1;
      var step = 100;
      var tl = screenToWorld(0, 0);
      var br = screenToWorld(width, height);
      for (var x = Math.floor(tl.x/step)*step; x <= Math.ceil(br.x/step)*step; x += step) {
        var p = worldToScreen(x, 0);
        ctx.beginPath(); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, height); ctx.stroke();
      }
      for (var y = Math.floor(br.y/step)*step; y <= Math.ceil(tl.y/step)*step; y += step) {
        var p = worldToScreen(0, y);
        ctx.beginPath(); ctx.moveTo(0, p.y); ctx.lineTo(width, p.y); ctx.stroke();
      }

      var terra = worldToScreen(0, 0);
      ctx.strokeStyle = '#333';
      ctx.beginPath();
      ctx.moveTo(terra.x - 15, terra.y); ctx.lineTo(terra.x + 15, terra.y);
      ctx.moveTo(terra.x, terra.y - 15); ctx.lineTo(terra.x, terra.y + 15);
      ctx.stroke();

      // [SYS-013] Jump-range ring around current ship location
      var currentSystem = getCurrentSystem();
      if (currentSystem) {
        var c = worldToScreen(currentSystem.x, currentSystem.y);
        ctx.strokeStyle = 'rgba(255, 0, 170, 0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(c.x, c.y, JUMP_RANGE_LY * view.scale, 0, Math.PI * 2);
        ctx.stroke();
      }

      var nr = Math.max(2, Math.min(4, view.scale * 8));
      for (var i = 0; i < systems.length; i++) {
        var s = systems[i];
        if (!isSystemRevealed(s, simYear)) continue;

        var p = worldToScreen(s.x, s.y);
        if (p.x < -10 || p.x > width+10 || p.y < -10 || p.y > height+10) continue;

        var isSel     = selected && selected.id === s.id;
        var isHov     = hovered  && hovered.id  === s.id;
        var isTerra   = s.id === 2371;
        var isCurrent = ship && Number(s.id) === Number(ship.systemId);

        ctx.beginPath();
        ctx.arc(p.x, p.y, isSel ? nr*1.5 : nr, 0, Math.PI*2);
        ctx.fillStyle = isTerra ? '#fc0' : isSel ? '#0fa' : isHov ? '#8cf' : '#556';
        ctx.fill();

        // [SYS-013] Current-location magenta ring (layered over base color)
        if (isCurrent) {
          ctx.strokeStyle = '#f0a';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, nr * 2.5, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (isSel) {
          ctx.strokeStyle = '#0fa';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, nr*2.5, 0, Math.PI*2);
          ctx.stroke();
        }

        if (isSel || isHov || isCurrent) {
          ctx.fillStyle = isSel ? '#0fa' : isCurrent ? '#f0a' : '#aaa';
          ctx.font = '11px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(s.name, p.x, p.y - nr - 5);
        }
      }

      document.getElementById('zoom').textContent = Math.round(view.scale * 100) + '%';
    }

    function updatePanel() {
      var actionsEl = document.getElementById('systemActions');
      if (!selected) {
        document.getElementById('systemName').textContent = '-';
        document.getElementById('systemInfo').innerHTML = '';
        actionsEl.innerHTML = '';
        return;
      }

      document.getElementById('systemName').textContent = selected.name;
      var distFromTerra = Math.sqrt(selected.x*selected.x + selected.y*selected.y).toFixed(1);

      // [SYS-013] Distance from current ship location
      var current = getCurrentSystem();
      var fromShipHtml = '';
      var pendingT = ship ? Number(ship.pendingJumpTargetId || 0) : 0;
      if (current && Number(current.id) !== Number(selected.id)) {
        var d = distanceLy(current, selected).toFixed(1);
        fromShipHtml = 'From Ship: '  + d  + ' LY<br>';
      } else if (current && Number(current.id) === Number(selected.id)) {
        fromShipHtml = '<span style="color:#f0a">You are here.</span><br>';
      }
      if (pendingT && pendingT === Number(selected.id)) {
        fromShipHtml += '<span style="color:#cf8">Pending jump target.</span><br>';
      }

      document.getElementById('systemInfo').innerHTML =
        'ID: '          + selected.id         + '<br>' +
        'X: '           + selected.x          + ' LY<br>' +
        'Y: '           + selected.y          + ' LY<br>' +
        'From Terra: '  + distFromTerra       + ' LY<br>' +
        fromShipHtml +
        'Revealed: '    + selected.revealYear;

      // [SYS-013] Action buttons — keyed off the K-F drive state machine.
      actionsEl.innerHTML = '';
      if (!ship || !current) {
        // Ship not loaded yet
        var setBtn0 = document.createElement('button');
        setBtn0.textContent = 'Set as starting position';
        setBtn0.onclick = setStartHere;
        actionsEl.appendChild(setBtn0);
        return;
      }

      var state    = getKfDriveState();
      var atSelf   = Number(current.id) === Number(selected.id);
      var distance = atSelf ? 0 : distanceLy(current, selected);
      var inRange  = distance <= JUMP_RANGE_LY;
      var isPendingTarget = pendingT && pendingT === Number(selected.id);

      // Helper to add a button
      function addBtn(label, cls, onClickFn, disabled) {
        var b = document.createElement('button');
        b.textContent = label;
        if (cls) b.className = cls;
        b.onclick = onClickFn;
        b.disabled = !!disabled;
        actionsEl.appendChild(b);
        return b;
      }

      if (state === 'READY' && !atSelf) {
        if (!inRange) {
          addBtn('Out of range (' + distance.toFixed(1) + ' LY)', 'btn-prep', null, true);
        } else {
          addBtn('Begin Jump Prep (' + distance.toFixed(1) + ' LY)', 'btn-prep', beginJumpPrep);
          addBtn('Emergency Jump',                                  'btn-emergency', emergencyJumpAction);
        }
      } else if (state === 'PREPPING') {
        if (isPendingTarget) {
          addBtn('Jump prep in progress — ' + formatTicks(prepRemaining()), 'btn-prep', null, true);
          addBtn('Abort Jump Prep',                                          'btn-abort', abortJumpPrepAction);
        } else if (!atSelf) {
          if (!inRange) {
            addBtn('Out of range (' + distance.toFixed(1) + ' LY)',          'btn-emergency', null, true);
          } else {
            addBtn('Emergency Jump (overrides prep)',                        'btn-emergency', emergencyJumpAction);
          }
        }
      } else if (state === 'READY_TO_JUMP') {
        if (isPendingTarget) {
          addBtn('Commit Jump',                                              'btn-commit', commitJumpAction);
          addBtn('Abort Jump Prep',                                          'btn-abort',  abortJumpPrepAction);
        } else if (!atSelf) {
          if (!inRange) {
            addBtn('Out of range (' + distance.toFixed(1) + ' LY)',          'btn-emergency', null, true);
          } else {
            addBtn('Emergency Jump (skips current prep)',                    'btn-emergency', emergencyJumpAction);
          }
        }
      } else if (state === 'RECHARGING' && !atSelf) {
        addBtn('Recharging — ' + formatTicks(rechargeRemaining()),           'btn-prep', null, true);
      }

      // Always offer the dev "set as starting position" option.
      var setBtn = document.createElement('button');
      setBtn.textContent = 'Set as starting position';
      setBtn.onclick = setStartHere;
      actionsEl.appendChild(setBtn);
    }

    function getMousePos(e) {
      var rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function onMouseDown(e) {
      var pos = getMousePos(e);
      drag = { x: pos.x, y: pos.y, vx: view.x, vy: view.y };
    }

    function onMouseMove(e) {
      var pos = getMousePos(e);
      if (drag) {
        var dx = (pos.x - drag.x) / view.scale;
        var dy = (pos.y - drag.y) / view.scale;
        view.x = drag.vx + dx;
        view.y = drag.vy - dy;
        draw();
      } else {
        hovered = findSystemAt(pos.x, pos.y);
        draw();
      }
    }

    function onMouseUp() { drag = null; }

    function onClick(e) {
      if (drag) return;
      var pos = getMousePos(e);
      selected = findSystemAt(pos.x, pos.y);
      updatePanel();
      draw();
    }

    function onDblClick(e) {
      var pos = getMousePos(e);
      var s = findSystemAt(pos.x, pos.y);
      if (s) {
        view.x = -s.x;
        view.y = -s.y;
        selected = s;
        updatePanel();
        draw();
      }
    }

    function onWheel(e) {
      e.preventDefault();
      view.scale *= e.deltaY > 0 ? 0.9 : 1.1;
      view.scale = Math.max(0.05, Math.min(5, view.scale));
      draw();
    }

    function centerTerra() {
      view.x = 0;
      view.y = 0;
      selected = systems.find(function(s) { return s.id === 2371; });
      updatePanel();
      draw();
    }

    // ─────────────────────────────────────────────
    // SYS-012 HALDEN
    // ─────────────────────────────────────────────
    function talkToHalden() {
      var input = document.getElementById('halden-input');
      var responseDiv = document.getElementById('halden-response');
      var text = input.value.trim();
      if (!text) return;
      responseDiv.textContent = '...';
      input.value = '';
      google.script.run
        .withSuccessHandler(function(response) {
          responseDiv.textContent = response;
        })
        .withFailureHandler(function(err) {
          responseDiv.textContent = 'ERROR: ' + err.message;
        })
        .talkToCharacter('char_001', 'player', text);
    }
  </script>
</body>
</html>
